                  - paragraph [ref=f11e133]: 蓋今儒者，本因古之六學，斯則王教之典籍，先聖所以明天道，〔一〕正人倫，致治之成法也。秦始皇焚書坑儒，六學自此缺矣。漢武帝立五經博士，（開）〔置〕弟子員，〔二〕設科射策，勸以官祿，其傳業者甚眾焉。自兩漢登賢，咸資經術。魏、晉浮蕩，儒教淪歇，公卿士庶，罕通經業矣。宋、齊之間，國學時復開置。梁武帝開五館，建國學，總以五經教授，（唯國學乃經）經各置助教云。〔三〕武帝或紆鑾駕，臨幸庠序，釋奠先師，躬親試冑，申之醼語，勞之束帛，濟濟焉斯蓋一代之盛矣。高祖創業開基，承前代離亂，衣冠殄盡，寇賊未寧，既日不暇給，弗遑勸課。世祖以降，稍置學官，雖博延生徒，成業蓋寡。今之採綴，蓋亦梁之遺儒云。
          - generic [ref=f11e134]:
            - heading "沈文阿" [level=2] [ref=f11e135]
            - generic [ref=f11e136]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B733&action=edit&section=1
          - paragraph [ref=f11e137]: 沈文阿字國衛，吳興武康人也。父峻，以儒學聞於梁世，授桂州刺史，不行。
          - paragraph [ref=f11e138]: 文阿性剛彊，有膂力，少習父業，研精章句。祖舅太史叔明、舅王慧興並通經術，而文阿頗傳之。又博採先儒異同，自為義疏。治三禮、三傳。察孝廉，為梁臨川王國侍郎，累遷兼國子助教、五經博士。
          - paragraph [ref=f11e139]: 梁簡文在東宮，引為學士，深相禮遇，及撰長春義記，多使文阿撮異聞以廣之。及侯景寇逆，簡文別遣文阿招募士卒，入援京師。城陷，與張嵊共保吳興，嵊敗，文阿竄于山野。景素聞其名，求之甚急，文阿窮迫不知所出，登樹自縊，遇有所親救之，便自投而下，折其左臂。及景平，高祖以文阿州里，表為原鄉令，監江陰郡。
          - paragraph [ref=f11e140]:
            - text: 紹泰元年，入為國子博士，尋領步兵校尉，兼掌儀禮。自太清之亂，臺閣故事，無有存者，文阿父峻，梁武世嘗掌朝儀，頗有遺
            - term [ref=f11e141]: 
            - text: ，於是斟酌裁撰，禮度皆自之出。及高祖受禪，文阿輒棄官還武康，高祖大怒，發使往誅之。時文阿宗人沈恪為郡，請使者寬其死，即面縛鎖頸致於高祖，高祖視而笑曰：「腐儒復何為者？」遂赦之。
          - paragraph [ref=f11e142]: 高祖崩，文阿與尚書左丞徐陵、中書舍人劉師知等議大行皇帝靈座俠御衣服之制，語在師知傳。及世祖即皇帝位，剋日謁廟，尚書右丞庾持奉詔遣博士議其禮。〔四〕文阿議曰：
          - paragraph [ref=f11e143]: 民物推移，質文殊軌，聖賢因機而立教，王公隨時以適宜。夫千人無君，不散則亂，萬乘無主，不危則亡。當隆周之日，公旦叔父，呂、召爪牙，成王在喪，禍幾覆國。是以既葬便有公冠之儀，始殯受麻冕之策。斯蓋示天下以有主，慮社稷之艱難。逮乎末葉縱橫，漢承其弊，雖文、景刑厝，而七國連兵。或踰月即尊，或崩日稱詔，此皆有為而為之，非無心於禮制也。今國諱之日，雖抑哀於璽紱之重，猶未序於君臣之儀。古禮，朝廟退坐正寢，聽群臣之政，今皇帝拜廟還，宜御太極殿，以正南面之尊，此即周康在朝一二臣衛者也。
          - paragraph [ref=f11e144]: 其壤奠之節，周禮以玉作贄，公侯以珪，子男執璧，此瑞玉也。奠贄既竟，又復致享，天子以璧，王后用琮。秦燒經典，威儀散滅，叔孫通定禮，尤失前憲，奠贄不珪，致享無帛，公王同璧，鴻臚奏賀。若此數事，未聞於古，後相沿襲，至梁行之。夫稱觴奉壽，家國大慶，四廂雅樂，歌奏懽欣。今君臣吞哀，萬民抑割，豈同於惟新之禮乎？且周康賓稱奉珪，無萬壽之獻，此則前準明矣。三宿三吒，上宗曰饗，斯蓋祭儐受福，寧謂賀酒邪！愚以今坐正殿，止行薦璧之儀，無賀酒之禮。謹撰謁廟還升正寢、群臣陪薦儀注如別。
          - paragraph [ref=f11e145]: 詔可施行。尋遷通直散騎常侍，兼國子博士，領羽林監，仍令於東宮講孝經、論語。天嘉四年卒，時年六十一。詔贈廷尉卿。
          - paragraph [ref=f11e146]: 文阿所撰儀禮八十餘卷，經典大義十八卷，並行於世，諸儒多傳其學。
          - generic [ref=f11e147]:
            - heading "沈洙" [level=2] [ref=f11e148]
            - generic [ref=f11e149]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B733&action=edit&section=2
          - paragraph [ref=f11e150]: 沈洙字弘道，吳興武康人也。祖休稚，〔五〕梁餘杭令。父山卿，梁國子博士、中散大夫。
          - paragraph [ref=f11e151]: 洙少方雅好學，不妄交遊。治三禮、春秋左氏傳。精識彊記，五經章句，諸子史書，問無不答。解巾梁湘東王國左常侍，轉中軍宣城王限內參軍，板仁威臨賀王記室參軍，遷尚書祠部郎中，時年蓋二十餘。大同中，學者多涉獵文史，不為章句，而洙獨積思經術，吳郡朱异、會稽賀琛甚嘉之。及异、琛於士林館講制旨義，常使洙為都講。侯景之亂，洙竄於臨安，時世祖在焉，親就習業。及高祖入輔，除國子博士，與沈文阿同掌儀禮。
          - paragraph [ref=f11e152]: 高祖受禪，加員外散騎常侍，歷揚州別駕從事史、大匠卿。有司奏前寧遠將軍、建康令沈孝軌門生陳三兒牒稱主人翁靈柩在周，主人奉使關內，因欲迎喪，久而未返。此月晦即是再周，主人弟息見在此者，為至月末除靈，內外即吉？為待主人還情禮申竟？以事諮左丞江德藻，德藻議：「王衛軍云：『久喪不葬，唯主人不變，其餘親各終月數而除。』此蓋引禮文論在家內有事故未得葬者耳。孝軌既在異域，雖已迎喪，還期無指，諸弟若遂不除，永絕婚嫁，此於人情，或為未允。中原淪陷已後，理有事例，宜諮沈常侍詳議。」洙議曰：「禮有變正，又有從宜。禮小記云：『久而不葬者，唯主（祭）〔喪〕者不除，〔六〕其餘以麻終月數者除喪則已。』注云：『其餘謂傍親。』如鄭所解，眾子皆應不除，王衛軍所引，此蓋禮之正也。〔七〕但魏氏東關之役，既失亡屍柩，葬禮無期，議以為禮無終身之喪，故制使除服。晉氏喪亂，或死於虜庭，無由迎殯，江左故復申明其制。李胤之祖，王華之父，並存亡不測，其子制服依時釋縗，此並變禮之宜也。孝軌雖因奉使便欲迎喪，而戎狄難親，還期未剋。愚謂宜依東關故事，在此國內者，並應釋除縗麻，毀靈附祭，若喪柩得還，別行改葬之禮。自天下寇亂，西朝傾覆，流播絕域，情禮莫申，若此之徒，諒非一二，寧可喪期無數，而弗除衰服，朝庭自應為之限制，以義斷恩，通訪博識，折之禮衷。」德藻依洙議，奏可。
          - paragraph [ref=f11e153]:
            - text: 世祖即位，遷通直散騎常侍，侍東宮讀。尋兼尚書左丞，領揚州大中正，遷光祿卿，侍讀如故。廢帝嗣位，重為通直散騎常侍，兼尚書左丞。遷戎昭將軍、輕車衡陽王長史，行府國事，帶琅邪、彭城二郡丞。梁代舊律，測囚之法，日一上，起自晡鼓，盡于二更。及比部郎范泉刪定律令，以舊法測立時久，非人所堪，分其刻數，日再上。廷尉以為新制過輕，請集八座丞郎并祭酒孔奐、行事沈洙五舍人會尚書省詳議。時高宗錄尚書，集眾議之，都官尚書周弘正曰：「未知獄所測人，有幾人款？幾人不款？須前責取人名及數并其罪目，然後更集。」得廷尉監沈仲由列稱，別制已後，有壽羽兒一人坐殺壽慧，劉磊渴等八人坐偷馬仗家口渡北，依法測之，限訖不款。劉道朔坐犯七改偷，依法測立，首尾二日而款。陳法滿坐被使封藏、阿法受錢，未及上而款。弘正議曰：「凡小大之獄，必應以情，正言依準五聽，驗其虛實，豈可全恣考掠，以判刑罪。且測人時節，本非古制，近代已來，方有此法。起自晡鼓，迄于二更，豈是常人所能堪忍？所以重械之下，危墯之上，無人不服，誣枉者多。朝晚二時，同等刻數，進退而求，於事為衷。若謂小促前期，致實罪不伏，如復時節延長，則無愆妄款。且人之所堪，既有彊弱，人之立意，固亦多途。至如貫高榜笞刺爇，身無完者，〔八〕戴就熏針並極，困篤不移，豈關時刻長短，掠測優劣？夫與殺不辜，寧失不經，罪疑惟輕，功疑惟重，斯則古之聖王，垂此明法。愚謂依范泉著制，於事為允。」舍人盛權議曰：「比部范泉新制，尚書周弘正明議，咸允虞書惟輕之旨，殷頌敷正之言。竊尋廷尉監沈仲由等列新制以後，凡有獄十一人，其所測者十人，款者唯一。愚謂染罪之囚，獄官宜明加辯析，窮考事理。若罪有可疑，自宜啟審分判，幸無濫測；若罪有實驗，乃可啟審測立；此則枉直有分，刑宥斯理。范泉今牒述漢律，云『死罪及除名，罪證明白，考掠已至，而抵隱不服者，處當列上』。杜預注云『處當，證驗明白之狀，列其抵隱之意』。竊尋舊制深峻，百中不款者一，新制寬優，十中不款者九，參會兩文，寬猛寔異，處當列上，未見釐革。愚謂宜付典法，更詳『處當列上』之文。」洙議曰：「夜中測立，緩急易欺，兼用晝漏，於事為允。但漏刻賒促，今古不同，漢書律曆，何承天、祖沖之、
            - term [ref=f11e154]: 
            - text: 之父子漏經，並自關鼓至下鼓，自晡鼓至關鼓，皆十三刻，冬夏四時不異。若其日有長短，分在中時前後。今用梁末改漏，下鼓之後，分其短長，夏至之日，各十七刻，冬至之日，各十二刻。伏承命旨，刻同勒令，檢一日之刻乃同，而四時之用不等，廷尉今牒，以時刻短促，（到）〔致〕罪人不款。〔九〕愚意願去夜測之昧，從晝漏之明，斟酌今古之間，參會二漏之義，捨秋冬之少刻，從夏日之長晷，不問寒暑，並依今之夏至，朝夕上測，各十七刻。比之古漏，則〔一〕上多昔四刻，〔一０〕即用今漏，則冬至多五刻。雖冬至之時，數刻侵夜，正是少日，〔一一〕於事非疑。庶罪人不以漏短而為捍，獄囚無以在夜（之）〔而〕致誣，〔一二〕求之鄙意，竊謂允合。」眾議以為宜依范泉前制，高宗曰：「沈長史議得中，宜更博議。」左丞宗元饒議曰：「竊尋沈議非頓異范，正是欲使四時均其刻數，兼斟酌其佳，以會優劇。即同牒請寫還刪定曹詳改前制。」高宗依事施行。
          - paragraph [ref=f11e155]: 洙以太建元年卒，時年五十二。
          - generic [ref=f11e156]:
            - heading "戚袞" [level=2] [ref=f11e157]
            - generic [ref=f11e158]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B733&action=edit&section=3
          - paragraph [ref=f11e159]: 戚袞字公文，吳郡鹽官人也。祖顯，齊給事中。父霸，梁臨賀王府中兵參軍。
          - paragraph [ref=f11e160]: 袞少聰慧，遊學京都，受三禮於國子助教劉文紹，一二年中，大義略備。年十九，梁武帝敕策孔子正言并周禮、禮記義，袞對高第。仍除揚州祭酒從事史。
          - paragraph [ref=f11e161]: 就國子博士宋懷方質儀禮義，懷方北人，自魏攜儀禮、禮記疏，祕惜不傳，及將亡，謂家人曰「吾死後，戚生若赴，便以儀禮、禮記義本付之，若其不來，即宜隨屍而殯」。其為儒者推許如此。尋兼太學博士。
          - paragraph [ref=f11e162]: 梁簡文在東宮，召袞講論。又嘗置宴集玄儒之士，先命道學互相質難，次令中庶子徐摛馳騁大義，間以劇談。摛辭辯縱橫，難以答抗，諸人懾氣，皆失次序。袞時騁義，〔一三〕摛與往復，袞精采自若，對答如流，簡文深加歎賞。尋除員外散騎侍郎，又遷員外散騎常侍。敬帝承制，出為江州長史，仍隨沈泰鎮南豫州。泰之奔齊也，逼袞俱行，後自鄴下遁還。又隨程文季北伐，呂梁軍敗，袞沒于周，久之得歸。仍兼國子助教，除中衛始興王府錄事參軍。太建十三年卒，時年六十三。
          - paragraph [ref=f11e163]: 袞於梁代撰三禮義記，值亂亡失，禮記義四十卷行於世。
          - generic [ref=f11e164]:
            - heading "鄭灼" [level=2] [ref=f11e165]
            - generic [ref=f11e166]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B733&action=edit&section=4
          - paragraph [ref=f11e167]: 鄭灼字茂昭，東陽信安人也。祖惠，梁衡陽太守。父季徽，通直散騎侍郎、建安令。
          - paragraph [ref=f11e168]: 灼幼而聰敏，勵志儒學，少受業于皇侃。梁中大通五年，釋褐奉朝請。累遷員外散騎侍郎、給事中、安東臨川王府記室參軍，轉平西邵陵王府記室。簡文在東宮，雅愛經術，引灼為西省義學士。承聖中，除通直散騎侍郎，兼國子博士。尋為威戎將軍，兼中書通事舍人。高祖、世祖之世，歷安東臨川、鎮北鄱陽二王府諮議參軍，累遷中散大夫，以本職兼國子博士。未拜，太建十三年卒，時年六十八。
          - paragraph [ref=f11e169]: 灼性精勤，尤明三禮。少時嘗夢與皇侃遇於途，侃謂灼曰「鄭郎開口」，侃因唾灼口中，自後義理逾進。灼家貧，抄義疏以日繼夜，筆毫盡，每削用之。灼常蔬食，講授多苦心熱，若瓜時，輒偃臥以瓜鎮心，起便誦讀，其篤志如此。
          - generic [ref=f11e170]:
            - heading "張崖、陸詡" [level=3] [ref=f11e171]
            - generic [ref=f11e172]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B733&action=edit&section=5
          - paragraph [ref=f11e173]: 時有晉陵張崖、吳郡陸詡、吳興沈德威、會稽賀德基，俱以禮學自命。
          - paragraph [ref=f11e174]: 張崖傳三禮於同郡劉文紹，仕梁歷王府中記室。天嘉元年，為尚書儀曹郎，廣沈文阿儀注，撰五禮。出為丹陽令、王府諮議參軍。御史中丞宗元饒表薦為國子博士。
          - paragraph [ref=f11e175]: 陸詡少習崔靈恩三禮義宗，梁世百濟國表求講禮博士，詔令詡行。還除給事中、定陽令。天嘉初，侍始興王伯茂讀，遷尚書祠部郎中。
          - generic [ref=f11e176]:
            - heading "沈德威" [level=2] [ref=f11e177]
            - generic [ref=f11e178]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B733&action=edit&section=6
          - paragraph [ref=f11e179]: 沈德威字懷遠，少有操行。梁太清末，遁於天目山，築室以居，雖處亂離，而篤學無倦，遂治經業。天嘉元年，徵出都，侍太子講禮傳。尋授太學博士，轉國子助教。每自學還私室以講授，道俗受業者數十百人，率常如此。遷太常丞，兼五禮學士，尋為尚書儀曹郎，後為祠部郎。俄丁母憂去職。禎明三年入隋，官至秦王府主簿。年五十五卒。
          - generic [ref=f11e180]:
            - heading "賀德基" [level=2] [ref=f11e181]
            - generic [ref=f11e182]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B733&action=edit&section=7
          - paragraph [ref=f11e183]:
            - text: 賀德基字承業，世傳禮學。祖文發，父淹，仕梁俱為祠部郎，並有名當世。德基少遊學于京邑，積年不歸，衣資罄乏，又恥服故弊，盛冬止衣裌襦
            - term [ref=f11e184]: 
            - text: 。嘗於白馬寺前逢一婦人，容服甚盛，呼德基入寺門，脫白綸巾以贈之。仍謂德基曰：「君方為重器，不久貧寒，故以此相遺耳。」德基問嫗姓名，不答而去。德基於禮記稱為精明，居以傳授，累遷尚書祠部郎。德基雖不至大官，而三世儒學，俱為祠部，時論美其不墜焉。
          - generic [ref=f11e185]:
            - heading "全緩" [level=2] [ref=f11e186]
            - generic [ref=f11e187]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B733&action=edit&section=8
          - paragraph [ref=f11e188]: 全緩字弘立，吳郡錢塘人也。幼受易于博士褚仲都，篤志研翫，得其精微。梁太清初，歷王國侍郎、奉朝請，俄轉國子助教，兼司義郎，專講詩、易。紹泰元年，除尚書水部郎。太建中，累遷〔鎮〕南始興王府諮議參軍，〔一四〕隨府詣湘州，以疾卒，時年七十四。緩治周易、老、莊，時人言玄者咸推之。
          - generic [ref=f11e189]:
            - heading "張譏" [level=2] [ref=f11e190]
            - generic [ref=f11e191]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B733&action=edit&section=9
          - paragraph [ref=f11e192]: 張譏字直言，清河武城人也。祖僧寶，梁散騎侍郎、太子洗馬。父仲悅，梁廬陵王府錄事參軍、尚書祠部郎中。
          - paragraph [ref=f11e193]: 譏幼聰俊，有思理，年十四，通孝經、論語。篤好玄言，受學于汝南周弘正，每有新意，為先輩推伏。梁大同中，召補國子正言生。梁武帝嘗於文德殿釋乾、坤文言，譏與陳郡袁憲等預焉，敕令論譏，諸儒莫敢先出，譏乃整容而進，諮審循環，辭令溫雅。梁武帝甚異之，賜裙襦絹等，仍云「表卿稽古之力」。
          - paragraph [ref=f11e194]: 譏幼喪母，有錯綵經帕，即母之遺製，及有所識，家人具以告之，每歲時輒對帕哽噎，不能自勝。及丁父憂，居喪過禮。服闋，召補湘東王國左常侍，轉田曹參軍，遷士林館學士。
          - paragraph [ref=f11e195]: 簡文在東宮，出士林館發孝經題，譏論議往復，甚見嗟賞，自是每有講集，必遣使召譏。及侯景寇逆，於圍城之中，猶侍哀太子於武德後殿講老、莊。梁臺陷，譏崎嶇避難，卒不事景。景平，歷臨安令。
          - paragraph [ref=f11e196]: 高祖受禪，除太常丞，轉始興王府刑獄參軍。天嘉中，遷國子助教。是時周弘正在國學，發周易題，弘正第四弟弘直亦在講席。譏與弘正論議，弘正乃屈，弘直危坐厲聲，助其申理。譏乃正色謂弘直曰：「今日義集，辯正名理，雖知兄弟急難，四公不得有助。」弘直曰：「僕助君師，何為不可？」舉座以為笑樂。弘正嘗謂人曰：「吾每登座，見張譏在席，使人懍然。」高宗世，歷建安王府記室參軍，兼東宮學士，轉武陵王限內記室，學士如故。
          - paragraph [ref=f11e197]: 後主在東宮，集官僚置宴，時造玉柄麈尾新成，後主親執之，曰：「當今雖復多士如林，至於堪捉此者，獨張譏耳。」即手授譏。仍令於溫文殿講莊、老，高宗幸宮臨聽，賜御所服衣一襲。後主嗣位，領南平王府諮議參軍、東宮學士。尋遷國子博士，學士如故。後主嘗幸鍾山開善寺召從臣坐於寺西南松林下，敕召譏豎義。時索麈尾未至，後主敕取松枝，手以屬譏，曰「可代麈尾」。顧謂群臣曰「此即是張譏後事」。禎明三年入隋，終於長安，時年七十六。
          - paragraph [ref=f11e198]: 譏性恬靜，不求榮利，常慕閑逸，所居宅營山池，植花果，講周易、老、莊而教授焉。吳郡陸元朗、朱孟博、一乘寺沙門法才、法雲寺沙門慧休、〔一五〕至真觀道士姚綏，皆傳其業。譏所撰周易義三十卷，尚書義十五卷，毛詩義二十卷，孝經義八卷，論語義二十卷，老子義十一卷，莊子內篇義十二卷，外篇義二十卷，雜篇義十卷，玄部通義十二卷，又撰遊玄桂林二十四卷，後主嘗敕人就其家寫入祕閣。
          - paragraph [ref=f11e199]: 子孝則，官至始安王記室參軍。
          - generic [ref=f11e200]:
            - heading "顧越" [level=2] [ref=f11e201]
            - generic [ref=f11e202]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B733&action=edit&section=10
          - paragraph [ref=f11e203]: 顧越字思南，〔一六〕吳郡鹽官人也。所居新坡黃岡，世有鄉校，由是顧氏多儒學焉。
          - paragraph [ref=f11e204]: 越少孤，以勤苦自立，聰慧有口辯，說毛氏詩，傍通異義，〔一七〕梁太子詹事周捨甚賞之。解褐揚州議曹史，兼太子左率丞。越於義理精明，尤善持論，與會稽賀文發俱為梁南平王偉所重，引為賓客。尋補五經博士。紹泰元年，遷國子博士。世祖即位，除始興王諮議參軍，〔一八〕侍東宮讀。世祖以越篤老，厚遇之，除給事黃門侍郎，又領國子博士，侍讀如故。廢帝嗣立，除通直散騎常侍、中書舍人。華皎之構逆也，越在東陽，或譖之於高宗，言其有異志，詔下獄，因坐免。太建元年卒於家，時年七十八。〔一九〕
          - paragraph [ref=f11e205]: 時有東陽龔孟舒者，亦治毛氏詩，善談名理。梁武世，仕至尋陽郡丞，元帝在江州，遇之甚重，躬師事焉。承聖中，兼中書舍人。天嘉初，除員外散騎常侍，兼國子助教、太中大夫。太建中卒。
          - generic [ref=f11e206]:
            - heading "沈不害" [level=2] [ref=f11e207]
            - generic [ref=f11e208]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B733&action=edit&section=11
          - paragraph [ref=f11e209]: 沈不害字孝和，吳興武康人也。祖總，齊尚書祠部郎。父懿，梁邵陵王參軍。
          - paragraph [ref=f11e210]: 不害幼孤，而脩立好學。十四，召補國子生，舉明經。累遷梁太學博士，轉廬陵王府刑獄參軍，長沙王府諮議，帶汝南令。天嘉初，除衡陽王府中記室參軍，兼嘉德殿學士。自梁季喪亂，至是國學未立，不害上書曰：
          - blockquote [ref=f11e211]:
            - paragraph [ref=f11e212]: 臣聞立人建國，莫尚於尊儒，成俗化民，必崇於教學。故東膠西序，事隆乎三代，環林璧水，業盛於兩京。自淳源既遠，澆波已扇，物之感人無窮，人之逐欲無節，是以設訓垂範，啟導心靈，譬彼染藍，類諸琢玉，然後人倫以睦，卑高有序，忠孝之理既明，君臣之道攸固。執禮自基，魯公所以難侮，歌樂已細，鄭伯於是前亡，干戚舞而有苗至，泮宮成而淮夷服，長想洙、泗之風，載懷淹、稷之盛，有國有家，莫不尚已。
            - paragraph [ref=f11e213]: 梁太清季年，數鍾否剝，戎狄外侵，姦回內奰，朝聞鼓鼙，夕炤烽火。洪儒碩學，解散甚於坑夷，五典、九丘，湮滅逾乎帷蓋。成均自斯墜業，瞽宗於是不脩，褒成之祠弗陳祼享，釋菜之禮無稱俎豆，頌聲寂莫，遂踰一紀。後生敦悅，不見函杖之儀，晚學鑽仰，徒深倚席之歎。
            - paragraph [ref=f11e214]: 陛下繼曆升統，握鏡臨宇，道洽寰中，威加無外，濁流已清，重氛載廓，含生熙阜，品庶咸亨。宜其弘振禮樂，建立庠序，式稽古典，紆跡儒宮，選公卿門子，皆入于學，助教博士，朝夕講肄，使擔簦負笈，鏘鏘接衽，方領矩步，濟濟成林。如切如磋，聞詩聞禮，一年可以功倍，三冬於是足用。故能擢秀雄州，揚庭觀國，入仕登朝，資優學以自輔，蒞官從政，有經業以治身，轖駕列庭，青紫拾地。
            - paragraph [ref=f11e215]: 古者王世子之貴，猶與國子齒，降及漢儲，茲禮不墜，暨乎兩晉，斯事彌隆，所以見師嚴而道尊者也。皇太子天縱生知，無待審喻，猶宜晦跡俯同，專經請業，奠爵前師，肅若舊典。昔闕里之堂，莫萊自辟，舊宅之內，絲竹流音，前聖遺烈，深以炯戒。況復江表無虞，海外有截，豈得不開闡大猷，恢弘至道？寧可使玄教儒風，弗興聖世，盛德大業，遂蘊堯年？臣末學小生，詞無足筭，輕獻瞽言，伏增悚惕。詔答曰：「省表聞之。自舊章弛廢，微言將絕，朕嗣膺寶業，念在緝熙，而兵革未息，軍國草創，常恐前王令典，一朝泯滅。卿才思優洽，文理可求，弘惜大體，殷勤名教，付外詳議，依事施行。
          - paragraph [ref=f11e216]: 又表改定樂章，詔使製三朝樂歌八首，合二十八曲，行之樂府。
          - paragraph [ref=f11e217]: 五年，除灨令。入為尚書儀曹郎，遷國子博士，領羽林監，敕治五禮，掌策文謚議。太建中，除仁武南康嗣王府長史，行丹陽郡事。轉員外散騎常侍、光祿卿。尋為戎昭將軍、明威武陵王長史，行吳興郡事。俄入為通直散騎常侍，兼尚書左丞。十二年卒，時年六十三。
          - paragraph [ref=f11e218]: 不害治經術，善屬文，雖博綜墳典，而家無卷軸。每製文，操筆立成，曾無尋檢。僕射汝南周弘正常稱之曰：「沈生可謂意聖人乎！」著治五禮儀一百卷，文集十四卷。
          - paragraph [ref=f11e219]: 子志道，字崇基，少知名。解褐揚州主簿，尋兼文林著士，歷安東新蔡王記室參軍。禎明三年入隋。
          - generic [ref=f11e220]:
            - heading "王元規" [level=2] [ref=f11e221]
            - generic [ref=f11e222]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B733&action=edit&section=12
          - paragraph [ref=f11e223]: 王元規字正範，太原晉陽人也。祖道寶，〔二０〕齊員外散騎常侍、晉安郡守。父瑋，梁武陵王府中記室參軍。
          - paragraph [ref=f11e224]: 元規八歲而孤，兄弟三人，隨母依舅氏往臨海郡，時年十二。郡土豪劉瑱者，資財巨萬，以女妻之。元規母以其兄弟幼弱，欲結彊援，元規泣請曰：「姻不失親，〔二一〕古人所重。豈得苟安異壤，輒婚非類！」母感其言而止。
          - paragraph [ref=f11e225]: 元規性孝，事母甚謹，晨昏未嘗離左右。梁時山陰縣有暴水，流漂居宅，元規唯有一小船，倉卒引其母妹并孤姪入船，〔二二〕元規自執楫棹而去，留其男女三人，閣於樹杪，及水退獲全，時人皆稱其至行。
          - paragraph [ref=f11e226]: 元規少好學，從吳興沈文阿受業，十八，通春秋左氏、孝經、論語、喪服。梁中大通元年，詔策春秋，舉高第，時名儒咸稱賞之。起家湘東王國左常侍，轉員外散騎侍郎。簡文之在東宮，引為賓客，每令講論，甚見優禮。除中軍宣城王府記室參軍。及侯景寇亂，攜家屬還會稽。天嘉中，除始興王府功曹參軍，領國子助教，轉鎮東鄱陽王府記室參軍，領助教如故。
          - paragraph [ref=f11e227]: 後主在東宮，引為學士，親受禮記、左傳、喪服等義，賞賜優厚。遷國子祭酒。新安王伯固嘗因入宮適會元規將講，乃啟請執經，時論以為榮。俄除尚書祠部郎。自梁代諸儒相傳為左氏學者，皆以賈逵、服虔之義難駮杜預，凡一百八十條，元規引證通析，無復疑滯。每國家議吉凶大禮，常參預焉。丁母憂去職，服闋，除鄱陽王府中錄事參軍，俄轉散騎侍郎，遷南平王府限內參軍。王為江州，元規隨府之鎮，四方學徒，不遠千里來請道者，常數十百人。禎明三年入隋，為秦王府東閤祭酒。年七十四，卒於廣陵。
          - paragraph [ref=f11e228]: 元規著春秋發題辭及義記十一卷，〔二三〕續經典大義十四卷，孝經義記兩卷，左傳音三卷，禮記音兩卷。
          - paragraph [ref=f11e229]: 子大業，聰敏知名。
          - paragraph [ref=f11e230]: 時有吳郡陸慶，少好學，遍知五經，尤明春秋左氏傳，節操甚高。釋褐梁武陵王國右常侍，歷征西府墨曹行參軍，除婁令。值梁季喪亂，乃覃心釋典，經論靡不該究。天嘉初，徵為通直散騎侍郎，不就。永陽王為吳郡太守，聞其名，欲與相見，慶固辭以疾。時宗人陸榮為郡五官掾，慶嘗詣焉，王乃微服往榮第，穿壁以觀之。王謂榮曰：「觀陸慶風神凝峻，殆不可測，嚴君平、鄭子真何以尚茲。」鄱陽、晉安王俱以記室徵，並不就。乃築室屏居，以禪誦為事，由是傳經受業者蓋鮮焉。
          - generic [ref=f11e231]:
            - heading "【評】" [level=2] [ref=f11e232]
            - generic [ref=f11e233]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B733&action=edit&section=13
          - paragraph [ref=f11e234]: 史臣曰：夫砥身勵行，必先經術，樹國崇家，率由茲道，故王政因之而至治，人倫得之而攸序。若沈文阿之徒，各專經授業，亦一代之鴻儒焉。文阿加復草創禮儀，蓋叔孫通之流亞矣。
          - generic [ref=f11e235]:
            - heading "校勘記" [level=2] [ref=f11e236]
            - generic [ref=f11e237]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B733&action=edit&section=14
          - paragraph [ref=f11e238]: 〔一〕 斯則王教之典籍先聖所以明天道 北監本、殿本作「以教之典籍，斯則先聖所以明天道」。
          - paragraph [ref=f11e239]: 〔二〕 （開）〔置〕弟子員 據北監本、汲本、殿本改。
          - paragraph [ref=f11e240]: 〔三〕 總以五經教授（唯國學乃經）經各置助教云 據北監本、殿本刪。按南史儒林傳序亦無此五字。
          - paragraph [ref=f11e241]: 〔四〕 尚書右丞庾持奉詔遣博士議其禮 「尚書右丞」南史作「尚書左丞」。按庾持傳，持於天嘉初遷尚書左丞。
          - paragraph [ref=f11e242]: 〔五〕 祖休稚 「休稚」南史作「休季」。金陵局本作「休雅」，殆稚雅形近而訛。
          - paragraph [ref=f11e243]: 〔六〕 唯主（祭）〔喪〕者不除 據禮記喪服小記原文改。
          - paragraph [ref=f11e244]: 〔七〕 此蓋禮之正也 「正」原本訛「主」，各本不訛，今改正。
          - paragraph [ref=f11e245]: 〔八〕 身無完者 「者」南、北監本及汲本並作「膚」。按漢書張耳陳餘傳正作「身無完者」，「者」作「膚」，乃後人臆改。
          - paragraph [ref=f11e246]: 〔九〕 （到）〔致〕罪人不款 據北監本、汲本、殿本及南史、元龜六一五改。
          - paragraph [ref=f11e247]: 〔一０〕則〔一〕上多昔四刻 據南史及元龜六一五補。按「一上」謂行測刑一次。
          - paragraph [ref=f11e248]: 〔一一〕正是少日 「正」原本訛「五」，各本不訛，今改正。
          - paragraph [ref=f11e249]: 〔一二〕獄囚無以在夜（之）〔而〕致誣 據各本及南史改。
          - paragraph [ref=f11e250]: 〔一三〕羇時騁義 北監本、殿本作「羇時說朝聘義」，南史作「時羇說朝聘義」。
          - paragraph [ref=f11e251]: 〔一四〕太建中累遷〔鎮〕南始興王府諮議參軍 按始興王叔陵傳，叔陵於太建四年遷鎮南將軍，明「南」上脫一「鎮」字，南史有，今據補。
          - paragraph [ref=f11e252]: 〔一五〕法雲寺沙門慧休 殿本考證云「休」南史作「拔」。
          - paragraph [ref=f11e253]: 〔一六〕顧越字思南 殿本考證云「思」南史作「允」。
          - paragraph [ref=f11e254]: 〔一七〕傍通異義 「異」字原本墨丁，據各本補。
          - paragraph [ref=f11e255]: 〔一八〕除始興王諮議參軍 南史作「除東中郎鄱陽王府諮議參軍」。張森楷校勘記云：「按鄱陽王伯山傳，伯山曾為東中郎，『始興王』應依南史作『鄱陽王』。」
          - paragraph [ref=f11e256]: 〔一九〕時年七十八 「七十八」南史作「七十七」。
          - paragraph [ref=f11e257]: 〔二０〕祖道寶 殿本考證云「寶」南史作「實」。
          - paragraph [ref=f11e258]: 〔二一〕姻不失親 按語本論語「因不失其親」，此以因作婚姻解，故改「因」為「姻」。詳錢大昕廿二史考異。
          - paragraph [ref=f11e259]: 〔二二〕倉卒引其母妹並孤姪入船 殿本考證云「孤」南史作「姑」。
          - paragraph [ref=f11e260]: 〔二三〕元規著春秋發題辭及義記十一卷 按：經典釋文敘錄言沈文阿撰春秋義略未竟，王元規續成之。隋書經籍志有王元規續沈文阿春秋左氏傳義略十卷。此「義記」當為「義略」之訛。
