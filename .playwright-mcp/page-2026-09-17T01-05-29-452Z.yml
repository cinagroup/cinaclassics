          - generic [ref=f6e134]:
            - heading "陳擬" [level=2] [ref=f6e135]
            - generic [ref=f6e136]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B715&action=edit&section=1
          - link "维基百科" [ref=f6e139] [cursor=pointer]:
            - /url: https://zh.wikipedia.org/wiki/%E7%BB%B4%E5%9F%BA%E7%99%BE%E7%A7%91
          - text: 條目：
          - link "陳擬" [ref=f6e141] [cursor=pointer]:
            - /url: https://zh.wikipedia.org/wiki/%E9%99%B3%E6%93%AC
          - paragraph [ref=f6e142]:
            - text: 陳擬字公正，高祖疏屬也。少孤貧，性質直彊記。高祖南征交趾，擬從焉。又進討侯景，至豫章，以擬為羅州刺史，與胡穎共知後事，並應接軍糧。高祖作鎮朱方，擬除步兵校尉、曲阿令。
            - link "紹泰元年" [ref=f6e144] [cursor=pointer]:
              - /url: /wiki/Category:555%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: ，授貞威將軍、義興太守。二年，入知衛尉事，除員外散騎常侍、明威將軍、雍州刺史，資監南徐州。
          - paragraph [ref=f6e145]:
            - text: 高祖踐祚，詔曰：「維城宗子，實固有周，盤石懿親，用隆大漢，故會盟則異姓為後，啟土則非劉勿王，所以糾合枝幹，廣樹蕃屏，前王懋典，列代恆規。從子持節、員外散騎常侍、明威將軍、雍州刺史、監南徐州擬，持節、通直散騎侍郎、貞威將軍、北徐州刺史褒，從子晃、炅，從孫假節、員外散騎常侍、明威將軍訬，假節、信威將軍、北徐州刺史吉陽縣開國侯諠，假節、通直散騎侍郎、信武將軍祏，
            - superscript [ref=f6e146]:
              - link "[1]" [ref=f6e147] [cursor=pointer]:
                - /url: "#cite_note-1"
            - text: 假節、散騎侍郎、雄信將軍、青州刺史、廣梁太守詳，貞威將軍、通直散騎侍郎慧紀，從孫敬雅、敬泰，並枝戚密近，劬勞王室，宜列河山，以光利建。擬可永脩縣開國侯，褒鍾陵縣開國侯，晃建城縣開國侯，炅上饒縣開國侯，訬虔化縣開國侯，諠仍前封，祏豫章縣開國侯，
            - superscript [ref=f6e148]:
              - link "[2]" [ref=f6e149] [cursor=pointer]:
                - /url: "#cite_note-2"
            - text: 詳遂興縣開國侯，慧紀宜黃縣開國侯，敬雅寧都縣開國侯，敬泰平固縣開國侯，各邑五百戶。」擬尋除輕車將軍，兼南徐州刺史，常侍如故。其年，授通直散騎常侍、中領軍。三年，復以本官監南徐州。世祖嗣位，除丹陽尹，常侍如故。坐事，又以白衣知郡，尋復本職。
            - link "天嘉元年" [ref=f6e151] [cursor=pointer]:
              - /url: /wiki/Category:560%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: 卒，時年五十八。贈領軍將軍，凶事所須，並官資給。諡曰定。二年，配享高祖廟廷。子黨嗣。
          - generic [ref=f6e152]:
            - heading "陳詳" [level=2] [ref=f6e153]
            - generic [ref=f6e154]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B715&action=edit&section=2
          - link "维基百科" [ref=f6e157] [cursor=pointer]:
            - /url: https://zh.wikipedia.org/wiki/%E7%BB%B4%E5%9F%BA%E7%99%BE%E7%A7%91
          - text: 條目：
          - link "陳詳 (南朝)" [ref=f6e159] [cursor=pointer]:
            - /url: https://zh.wikipedia.org/wiki/%E9%99%B3%E8%A9%B3_(%E5%8D%97%E6%9C%9D)
          - paragraph [ref=f6e160]:
            - text: 陳詳字文幾，少出家為桑門。善書記，談論清雅。高祖討侯景，召詳，令反初服，配以兵馬，從定京邑。高祖東征杜龕，詳別下安吉、原鄉、故鄣三縣。龕平，以功授散騎侍郎、假節、雄信將軍、青州刺史，資割故鄣、廣德置廣梁郡，以詳為太守。高祖踐祚，改廣梁為陳留，又以為陳留太守。
            - link "永定二年" [ref=f6e162] [cursor=pointer]:
              - /url: /wiki/Category:558%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: ，封遂興縣侯，食邑五百戶。其年除明威將軍、通直散騎常侍。三年，隨侯安都破王琳將常眾愛於宮亭湖。世祖嗣位，除宣城太守，將軍如故。王琳下據柵口，詳隨吳明徹襲湓城，取琳家口，不克，因入南湖，自鄱陽步道而歸。琳平，詳與明徹並無功。
            - link "天嘉元年" [ref=f6e164] [cursor=pointer]:
              - /url: /wiki/Category:560%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: ，隨例增邑并前一千五百戶。仍除通直散騎常侍，兼右衛將軍。三年，出為假節、都督吳州諸軍事、仁威將軍、吳州刺史。
          - paragraph [ref=f6e165]: 周迪據臨川舉兵，詳自州從他道襲迪於濡城別營，獲其妻子。迪敗走，詳還復本鎮。五年，周迪復出臨川，乃以詳為都督，率水步討迪。軍至南城，與賊相遇，戰敗，死之，時年四十二。以所統失律，無贈諡。子正理嗣。
          - generic [ref=f6e166]:
            - heading "陳慧紀" [level=2] [ref=f6e167]
            - generic [ref=f6e168]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B715&action=edit&section=3
          - link "维基百科" [ref=f6e171] [cursor=pointer]:
            - /url: https://zh.wikipedia.org/wiki/%E7%BB%B4%E5%9F%BA%E7%99%BE%E7%A7%91
          - text: 條目：
          - link "陳慧紀" [ref=f6e173] [cursor=pointer]:
            - /url: https://zh.wikipedia.org/wiki/%E9%99%B3%E6%85%A7%E7%B4%80
          - paragraph [ref=f6e174]:
            - text: 陳慧紀字元方，高祖之從孫也。涉獵書史，負才任氣。高祖平侯景，慧紀從焉。尋配以兵馬。景平，從征杜龕。除貞威將軍、通直散騎常侍。高祖踐祚，封宜黃縣侯，邑五百戶，除黃門侍郎。世祖即位，出為安吉縣令。遷明威將軍軍副。司空章昭達征安蜀城，慧紀為水軍都督，於荊州燒青泥船艫。
            - link "光大元年" [ref=f6e176] [cursor=pointer]:
              - /url: /wiki/Category:567%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: ，以功除持節、通直散騎常侍、宣遠將軍、豐州刺史，增邑并前一千戶。
            - link "太建十年" [ref=f6e178] [cursor=pointer]:
              - /url: /wiki/Category:578%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: ，吳明徹北討敗績，以慧紀為持節、智武將軍、緣江都督、兗州刺史，增邑并前二千戶，餘如故。周軍乘勝據有淮南，江外騷擾，慧紀收集士卒，自海道還都。尋除使持節、散騎常侍、宣毅將軍、都督郢巴二州諸軍事、郢州刺史，增邑并前二千五百戶。
            - link "至德二年" [ref=f6e180] [cursor=pointer]:
              - /url: /wiki/Category:%E9%9C%80%E8%A6%81%E6%8C%87%E5%AE%9A%E5%85%AC%E5%85%83%E7%9A%84%E7%B4%80%E5%B9%B4
            - text: ，遷使持節、散騎常侍、雲麾將軍、都督荊信二州諸軍事、荊州刺史，賜女伎一部，增邑并前三千戶。
            - link "禎明元年" [ref=f6e182] [cursor=pointer]:
              - /url: /wiki/Category:587%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: ，蕭琮尚書左僕射安平王蕭巖、晉熙王〔蕭〕瓛等，
            - superscript [ref=f6e183]:
              - link "[3]" [ref=f6e184] [cursor=pointer]:
                - /url: "#cite_note-3"
            - text: 率其部眾男女二萬餘口，詣慧紀請降，慧紀以兵迎之。其年，以應接之功，加侍中、金紫光祿大夫、開府儀同三司、征西將軍，增邑并前六千戶，餘如故。
          - paragraph [ref=f6e185]:
            - text: 及隋師濟江，元帥清河公楊素下自巴硤，慧紀遣其將呂忠肅、陸倫等拒之，
            - superscript [ref=f6e186]:
              - link "[4]" [ref=f6e187] [cursor=pointer]:
                - /url: "#cite_note-4"
            - text: 戰敗，素進據馬頭。是時，隋將韓擒虎及賀若弼等已濟江據蔣山，慧紀聞之，留其長史陳文盛等居守，身率將士三萬人，樓船千餘乘，沿江而下，欲趣臺城。至漢口，為秦王軍所拒，不得進，因與湘州刺史晉熙王叔文、巴州刺史畢寶等請降。入隋，依例授儀同三司。頃之卒。子正平，頗有文學。
          - generic [ref=f6e188]:
            - heading "【評】" [level=2] [ref=f6e189]
            - generic [ref=f6e190]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B715&action=edit&section=4
          - paragraph [ref=f6e191]:
            - text: 史臣曰：《
            - link "詩" [ref=f6e192] [cursor=pointer]:
              - /url: /wiki/%E8%A9%A9%E7%B6%93
            - text: 》云「宗子維城，無俾城壞」。又曰「綿綿瓜瓞，葛藟纍之」。西京皆豐沛故人，東都亦南陽多顯，有以哉。
          - generic [ref=f6e193]:
            - heading "校勘記" [level=3] [ref=f6e194]
            - generic [ref=f6e195]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B715&action=edit&section=5
          - list [ref=f6e196]:
            - listitem [ref=f6e197]:
              - link "↑" [ref=f6e199] [cursor=pointer]:
                - /url: "#cite_ref-1"
              - generic [ref=f6e200]:
                - text: 信武將軍祏 「信武將軍」《
                - link "南史" [ref=f6e201] [cursor=pointer]:
                  - /url: /wiki/%E5%8D%97%E5%8F%B2
                - text: ·陳宗室諸王傳》作「信威將軍」。
            - listitem [ref=f6e202]:
              - link "↑" [ref=f6e204] [cursor=pointer]:
                - /url: "#cite_ref-2"
              - text: 祏豫章縣開國侯 「豫章縣」，《南史》作「豫寧縣」。
            - listitem [ref=f6e205]:
              - link "↑" [ref=f6e207] [cursor=pointer]:
                - /url: "#cite_ref-3"
              - text: 蕭琮尚書左僕射安平王蕭巖晉熙王〔蕭〕瓛等 據北監本、汲本、殿本補。按「尚書左僕射」〈後主紀〉作「尚書令」。「晉熙王」〈後主紀〉作「義興王」。
            - listitem [ref=f6e208]:
              - link "↑" [ref=f6e210] [cursor=pointer]:
                - /url: "#cite_ref-4"
              - generic [ref=f6e211]:
                - text: 慧紀遣其將呂忠肅陸倫等拒之 殿本考證云：「《南史》無『忠』字，亦不載陸倫。」今按：《南史》無「忠」字，蓋改復名為單名。《
                - link "隋書" [ref=f6e212] [cursor=pointer]:
                  - /url: /wiki/%E9%9A%8B%E6%9B%B8
                - text: ·楊素傳》「忠」作「仲」，則避隋文帝父楊忠諱改。
