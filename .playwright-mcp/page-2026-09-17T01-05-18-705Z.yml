                  - paragraph [ref=f5e130]: 徐世譜 魯悉達 周敷 荀朗 周炅
                - cell [ref=f5e131]:
                  - text: ►
                  - link "卷十四" [ref=f5e132] [cursor=pointer]:
                    - /url: /wiki/%E9%99%B3%E6%9B%B8/%E5%8D%B714
          - table [ref=f5e133]:
            - rowgroup [ref=f5e134]:
              - row [ref=f5e135]:
                - cell [ref=f5e136]:
                  - list [ref=f5e137]:
                    - listitem [ref=f5e138]:
                      - link [ref=f5e141] [cursor=pointer]:
                        - /url: /wiki/Special:SiteMatrix
                        - img "姊妹计划" [ref=f5e142]
                      - link "姊妹计划" [ref=f5e143] [cursor=pointer]:
                        - /url: /wiki/Special:SiteMatrix
                      - text: ":"
                      - link "数据项" [ref=f5e144] [cursor=pointer]:
                        - /url: https://www.wikidata.org/wiki/Q85380556
                  - table [ref=f5e145]:
                    - rowgroup [ref=f5e146]:
                      - row [ref=f5e147]:
                        - cell [ref=f5e148]
                  - paragraph [ref=f5e149]: 徐世譜 魯悉達 周敷 荀朗 周炅
          - generic [ref=f5e150]:
            - heading "徐世譜" [level=2] [ref=f5e151]
            - generic [ref=f5e152]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B713&action=edit&section=1
          - paragraph [ref=f5e153]: 徐世譜字興宗，巴東魚復人也。世居荊州，為主帥，征伐蠻、蜒。至世譜，尤敢勇有膂力，善水戰。梁元帝之為荊州刺史，世譜將領鄉人事焉。
          - paragraph [ref=f5e154]:
            - text: 侯景之亂，因預征討，累遷至員外散騎常侍。尋領水軍，從司徒陸法和討景，與景戰於赤亭湖。時景軍甚盛，世譜乃別造樓船、拍艦、火舫、水車以益軍勢。將戰，又乘大艦居前，大敗景軍，生擒景將任約，景退走。因隨王僧辯攻郢州，世譜復乘大艦臨其倉門，賊將宋子仙據城降。以功除使持節、信武將軍、信州刺史，封魚復縣侯，邑五百戶。仍隨僧辯東下，恆為軍鋒。又破景將侯子鑒於湖熟。
            - superscript [ref=f5e155]:
              - link "[1]" [ref=f5e156] [cursor=pointer]:
                - /url: "#cite_note-1"
            - text: 侯景平後，以功除通直散騎常侍、衡州刺史資，（鎮）〔領〕河東太守，
            - superscript [ref=f5e157]:
              - link "[2]" [ref=f5e158] [cursor=pointer]:
                - /url: "#cite_note-2"
            - text: 增邑并前一千戶。
          - paragraph [ref=f5e159]:
            - text: 西魏來寇荊州，世譜鎮馬頭岸，據有龍（州）〔洲〕，
            - superscript [ref=f5e160]:
              - link "[3]" [ref=f5e161] [cursor=pointer]:
                - /url: "#cite_note-3"
            - text: 元帝授侍中、使持節、都督江南諸軍事、鎮南將軍、護軍將軍，給鼓吹一部。江陵陷沒，世譜東下依侯瑱。
          - paragraph [ref=f5e162]:
            - link "紹泰元年" [ref=f5e164] [cursor=pointer]:
              - /url: /wiki/Category:555%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: ，徵為侍中、左衛將軍。高祖之拒王琳，其水戰之具，悉委世譜。世譜性機巧，諳解舊法，所造器械，並隨機損益，妙思出人。
          - paragraph [ref=f5e165]:
            - link "永定二年" [ref=f5e167] [cursor=pointer]:
              - /url: /wiki/Category:558%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: ，遷護軍將軍。世祖嗣位，加特進，進號安右將軍。天嘉元年，增邑五百戶。二年，出為使持節、散騎常侍、都督宣城郡諸軍事、安西將軍、宣城太守，秩中二千石。還為安前將軍、右光祿大夫。尋以疾失明，謝病不朝。四年卒，時年五十五。贈本官，諡曰桓侯。
          - paragraph [ref=f5e168]: 世譜從弟世休，隨世譜自梁征討，亦有戰功。官至員外散騎常侍、安遠將軍，枳縣侯，邑八百戶。光大二年，隸都督淳于量征華皎。卒，贈通直散騎常侍，諡曰壯。
          - generic [ref=f5e169]:
            - heading "魯悉達" [level=2] [ref=f5e170]
            - generic [ref=f5e171]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B713&action=edit&section=2
          - paragraph [ref=f5e172]: 魯悉達字志通，扶風郿人也。祖斐，齊通直散騎常侍、安遠將軍、衡州刺史，陽塘侯。父益之，梁雲麾將軍、新蔡義陽二郡太守。
          - paragraph [ref=f5e173]: 悉達幼以孝聞，起家為梁南平嗣王中兵參軍。侯景之亂，悉達糾合鄉人，保新蔡，力田蓄穀。時兵荒饑饉，京都及上川餓死者十八九，有得存者，皆攜老幼以歸焉。悉達分給糧廩，其所濟活者甚眾，仍於新蔡置頓以居之。招集晉熙等五郡，盡有其地。使其弟廣達領兵隨王僧辯討侯景。景平，梁元帝授持節、仁威將軍、散騎常侍、北江州刺史。
          - paragraph [ref=f5e174]:
            - text: 敬帝即位，王琳據有上流，留異、余孝頃、周迪等所在鋒起
            - superscript [ref=f5e175]:
              - link "[4]" [ref=f5e176] [cursor=pointer]:
                - /url: "#cite_note-4"
            - text: ，悉達撫綏五郡，甚得民和，士卒皆樂為之用。琳授悉達鎮北將軍，高祖亦遣趙知禮授征西將軍、江州刺史，各送鼓吹女樂，悉達兩受之，遷延顧望，皆不就。高祖遣安西將軍沈泰潛師襲之，不能克。齊遣行臺慕容紹宗以眾三萬來攻鬱口諸鎮，
            - superscript [ref=f5e177]:
              - link "[5]" [ref=f5e178] [cursor=pointer]:
                - /url: "#cite_note-5"
            - text: 兵甲甚盛，悉達與戰，敗齊軍，紹宗僅以身免。
          - paragraph [ref=f5e179]: 王琳欲圖東下，以悉達制其中流，恐為己患，頻遣使招誘，悉達終不從。琳不得下，乃連結於齊，共為表裏，齊遣清河王高岳助之。相持歲餘，會裨將梅天養等懼罪，乃引齊軍入城。悉達勒麾下數千人，濟江而歸高祖。高祖見之，甚喜，曰：「來何遲也？」悉達對曰：「臣鎮撫上流，願為蕃屏，陛下授臣以官，恩至厚矣，沈泰襲臣，威亦深矣，然臣所以自歸於陛下者，誠以陛下豁達大度，同符漢祖故也。」高祖嘆曰：「卿言得之矣。」授平南將軍、散騎常侍、北江州刺史，封彭澤縣侯。世祖即位，進號安左將軍。
          - paragraph [ref=f5e180]: 悉達雖仗氣任俠，不以富貴驕人，雅好詞賦，招禮才賢，與之賞會。遷安南將軍、吳州刺史。遭母憂，哀毀過禮，因遘疾卒，時年三十八。贈安左將軍、江州刺史，諡曰孝侯。子覽嗣。弟廣達，別有傳。
          - generic [ref=f5e181]:
            - heading "周敷" [level=2] [ref=f5e182]
            - generic [ref=f5e183]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B713&action=edit&section=3
          - paragraph [ref=f5e184]: 周敷字仲遠，臨川人也。為郡豪族。敷形貌眇小，如不勝衣，而膽力勁果，超出時輩。性豪俠，輕財重士，鄉黨少年任氣者咸歸之。
          - paragraph [ref=f5e185]:
            - text: 侯景之亂，鄉人周續合徒眾以討賊為名，梁內史始興藩王蕭毅以郡讓續，
            - superscript [ref=f5e186]:
              - link "[6]" [ref=f5e187] [cursor=pointer]:
                - /url: "#cite_note-6"
            - text: 續所部內有欲侵掠於毅，敷擁護之，親率其黨捍衛，送至豫章。時觀寧侯蕭永、長樂侯蕭基、豐城侯蕭泰避難流寓，聞敷信義，皆往依之。敷愍其危懼，屈體崇敬，厚加給卹，送之西上。
          - paragraph [ref=f5e188]: 俄而續部下將帥爭權，復反，殺續以降周迪。迪素無簿閥，恐失眾心，倚敷族望，深求交結。敷未能自固，事迪甚恭，迪大憑仗之，漸有兵眾。迪據臨川之工塘，敷鎮臨川故郡。侯景平，梁元帝授敷使持節、通直散騎常侍、信武將軍、寧州刺史，封西豐縣侯，邑一千戶。
          - paragraph [ref=f5e189]:
            - text: 高祖受禪，王琳據有上流，余孝頃與琳黨李（希）〔孝〕欽等共圍周迪，
            - superscript [ref=f5e190]:
              - link "[7]" [ref=f5e191] [cursor=pointer]:
                - /url: "#cite_note-7"
            - text: 敷大致人馬以助於迪。迪擒孝頃等，敷功居多。
          - paragraph [ref=f5e192]: 熊曇朗之殺周文育，據豫章，將兵萬餘人襲敷，徑至城下，敷與戰，大敗之，追奔五十餘里，曇朗單馬獲免，盡收其軍實。曇朗走巴山郡，收合餘黨，敷因與周迪、黃法𣰋等進兵圍曇朗，屠之。
          - paragraph [ref=f5e193]:
            - text: 王琳平，授散騎常侍、平西將軍、豫章太守。是時南江酋帥並顧戀巢窟，私署令長，不受召，朝廷未遑致討，但羈縻之，唯敷獨先入朝。
            - link "天嘉二年" [ref=f5e195] [cursor=pointer]:
              - /url: /wiki/Category:561%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: ，詣闕，進號安西將軍，給鼓吹一部，賜以女樂一部，
            - superscript [ref=f5e196]:
              - link "[8]" [ref=f5e197] [cursor=pointer]:
                - /url: "#cite_note-8"
            - text: 令還鎮豫章。
          - paragraph [ref=f5e198]: 周迪以敷素出己下，超致顯貴，深不平、乃舉兵反，遣弟方興以兵襲敷。敷與戰，大破方興。仍率眾從都督吳明徹攻迪，破之，擒其弟方興并諸渠帥。詔以敷為安西將軍、臨川太守，餘並如故。尋徵為使持節、都督南豫北江二州諸軍事、鎮南將軍、南豫州刺史，增邑五百戶，常侍、鼓吹如故。
          - paragraph [ref=f5e199]:
            - text: 五年，迪又收合餘眾，還襲東興。世祖遣都督章昭達征迪，敷又從軍。至定川縣，與迪相對。迪紿敷曰：「吾昔與弟戮力同心，宗從匪他，豈規相害。今願伏罪還朝，因弟披露心腑，先乞挺身共立盟誓。」敷許之，方登壇，為迪所害，時年三十五。詔曰：「使持節、散騎常侍、都督南豫州緣江諸軍事、鎮南將軍、南豫州刺史西豐縣開國侯敷，受任遐征，淹時違律，虛衿姦詭，遂貽喪仆。
            - superscript [ref=f5e200]:
              - link "[9]" [ref=f5e201] [cursor=pointer]:
                - /url: "#cite_note-9"
            - text: 但夙著勤誠，亟勞戎旅，猶深惻愴，愍悼于懷。可存其茅賦，量所賻卹，還葬京邑。」諡曰脫。子智安嗣。
          - paragraph [ref=f5e202]: 敷兄彖，共敷據本鄉，亦授臨川太守。
          - generic [ref=f5e203]:
            - heading "荀朗" [level=2] [ref=f5e204]
            - generic [ref=f5e205]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B713&action=edit&section=4
          - paragraph [ref=f5e206]: 荀朗字深明，潁川潁陰人也。祖延祖，梁潁川太守，父伯道，衛尉卿。
          - paragraph [ref=f5e207]: 朗少慷慨，有將帥大略，起家梁廬陵王行參軍。侯景之亂，朗招率徒旅，據巢湖閒，無所屬。臺城陷後，簡文帝密詔授朗雲麾將軍、豫州刺史，令與外藩討景。景使儀同宋子仙、任約等頻往征之，朗據山立砦自守，子仙不能克。時京師大饑，百姓皆於江外就食，朗更招致部曲，解衣推食，以相賑贍，眾至數萬人。侯景敗於巴陵，朗出自濡須截景，破其後軍。王僧辯東討，朗遣其將范寶勝及弟曉領兵二千助之。侯景平後，又別破齊將郭元建於踟躕山。梁承聖二年，率部曲萬餘家濟江，入宣城郡界立頓。梁元帝授朗持節、通直散騎常侍、安南將軍、都督南兗州諸軍事、南兗州刺史。未行而荊州陷。
          - paragraph [ref=f5e208]: 高祖入輔，齊遣蕭軌、東方老等來寇，據石頭城。朗自宣城來赴，因與侯安都等大破齊軍。永定元年，賜爵興寧縣侯，邑二千戶，以朗兄昂為左衛將軍，弟晷為太子右衛率。尋遣朗隨世祖拒王琳於南皖。
          - paragraph [ref=f5e209]:
            - text: 高祖崩，宣太后與舍人蔡景歷祕不發喪，朗弟曉在都微知之，乃謀率其家兵襲臺。事覺，景歷殺曉，仍繫其兄弟。世祖即位，並釋之。因厚撫慰朗，令與侯安都等共拒王琳。琳平，遷使持節、安北將軍、散騎常侍、都督霍晉合三州諸軍事、合州刺史。
            - link "天嘉六年" [ref=f5e211] [cursor=pointer]:
              - /url: /wiki/Category:565%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: 卒，時年四十八。贈南豫州刺史，諡曰壯。子法尚嗣。
          - generic [ref=f5e212]:
            - heading [level=3] [ref=f5e213]:
              - subscript [ref=f5e214]: 子
              - text: 法尚
            - generic [ref=f5e215]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B713&action=edit&section=5
          - paragraph [ref=f5e216]: 法尚少俶儻，有文武幹略，起家江寧令，襲爵興寧縣侯。太建五年，隨吳明徹北伐。尋授通直散騎侍郎，除涇令，歷梁、安城太守。禎明中，為都督郢巴武三州諸軍事、郢州刺史。及隋軍濟江，法尚降于漢東道元帥秦王。入隋，歷邵、觀、綿、豐四州刺史，巴東、燉煌二郡太守。
          - generic [ref=f5e217]:
            - heading "周炅" [level=2] [ref=f5e218]
            - generic [ref=f5e219]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B713&action=edit&section=6
          - paragraph [ref=f5e220]: 周炅字文昭，汝南安成人也。祖彊，齊太子舍人、梁州刺史。父靈起，梁通直散騎常侍、廬桂二州刺史，保城縣侯。
          - paragraph [ref=f5e221]: 炅少豪俠任氣，有將帥才。梁大同中為通直散騎侍郎、朱衣直閤。太清元年，出為弋陽太守。侯景之亂，元帝承制改授西陽太守，封西陵縣伯。景遣兄子思穆據守齊安，炅率驍勇襲破思穆，擒斬之。以功授持節、高州刺史。是時炅據武昌、西陽二郡，招聚卒徒，甲兵甚盛。景將任約來據樊山，炅與寧州長史徐文盛擊約，斬其部將叱羅子通、趙迦婁等。因乘勝追之，頻克，約眾殆盡。承聖元年，遷使持節、都督江定二州諸軍事、戎昭將軍、江州刺史，進爵為侯，邑五百戶。
          - paragraph [ref=f5e222]: 高祖踐祚，王琳擁據上流，炅以州從之。及王琳遣其將曹慶等攻周迪，仍使炅將兵掎角而進，為侯安都所敗，擒炅送都。世祖釋炅，授戎威將軍、定州刺史，帶西陽、武昌二郡太守。
          - paragraph [ref=f5e223]:
            - link "天嘉二年" [ref=f5e225] [cursor=pointer]:
              - /url: /wiki/Category:561%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: ，留異據東陽反，世祖召炅還都，欲令討異。未至而異平，炅還本鎮。天康元年，預平華皎之功，授員外散騎常侍。太建元年，遷持節、龍驤將軍、通直散騎常侍。
          - paragraph [ref=f5e226]: 五年，進授使持節、西道都督安蘄江衡司定六州諸軍事、安州刺史，改封龍源縣侯，增邑并前一千戶。其年隨都督吳明徹北討，所向克捷，一月之中，獲十二城。齊遣尚書左丞陸騫以眾二萬出自巴、蘄，與炅相遇。炅留羸弱輜重，設疑兵以當之，身率精銳，由間道邀其後，大敗騫軍，虜獲器械馬驢，不可勝數。進攻巴州，克之。於是江北諸城及穀陽士民，並誅渠帥以城降。進號和戎將軍、散騎常侍，增邑并前一千五百戶。仍敕追炅入朝。
          - paragraph [ref=f5e227]:
            - text: 初，蕭詧定州刺史田龍升以城降，詔以為振遠將軍、定州刺史，封赤亭王。及炅入朝，龍升以江北六州七鎮叛入于齊，齊遣歷陽王高景安帥師應之。於是令炅為江北道大都督，總統眾軍，以討龍升。龍升使弋陽太守田龍琰率眾二萬陣於亭川，高景安於水陵、陰山為其聲援，龍升引軍別營山谷。炅乃分兵各當其軍，身率驍勇先擊龍升，龍升大敗，龍琰望塵而奔，並追斬之，高景安遁走，盡復江北之地。以功增邑并前二千戶，進號平北將軍，定州刺史，持節、都督如故，仍賜女妓一部。
            - link "太建八年" [ref=f5e229] [cursor=pointer]:
              - /url: /wiki/Category:576%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: 卒官，時年六十四。贈司州刺史，封武昌郡公，諡曰壯。子法僧嗣，官至宣城太守。
          - generic [ref=f5e230]:
            - heading "【史論】" [level=2] [ref=f5e231]
            - generic [ref=f5e232]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B713&action=edit&section=7
          - paragraph [ref=f5e233]: 史臣曰：彼數子者，或驅馳前代，或擁據故鄉，並識運知歸，因機景附，位升列牧，爵致通侯，美矣。昔張耳、陳餘自同於至戚，周敷、周迪亦誓等暱親，尋鋒刃而誅殘，斯甚夫胡越矣。讎隙因於勢利，何其鄙歟？
          - generic [ref=f5e234]:
            - heading "校勘記" [level=3] [ref=f5e235]
            - generic [ref=f5e236]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B713&action=edit&section=8
          - list [ref=f5e237]:
            - listitem [ref=f5e238]:
              - link "跳转" [ref=f5e240] [cursor=pointer]:
                - /url: "#cite_ref-1"
                - text: ↑
              - text: 又破景將侯子鑒於湖熟 按「湖熟」當作「姑孰」。梁元帝承聖元年，王僧辯等破侯景將侯子鑒於姑孰，見《梁書·侯景傳》及《通鑑》。
            - listitem [ref=f5e241]:
              - link "跳转" [ref=f5e243] [cursor=pointer]:
                - /url: "#cite_ref-2"
                - text: ↑
              - text: （鎮）〔領〕河東太守 據《南史》改。按錢大昕《廿二史考異》云：「『鎮』當作『領』。梁、陳之間，往往有以刺史資領郡守、縣令者。」
            - listitem [ref=f5e244]:
              - link "跳转" [ref=f5e246] [cursor=pointer]:
                - /url: "#cite_ref-3"
                - text: ↑
              - text: 據有龍（州）〔洲〕據《南史》改。按《讀史方輿紀要》七八，荊州府江陵縣有龍洲，在府西南十六里江中。
            - listitem [ref=f5e247]:
              - link "跳转" [ref=f5e249] [cursor=pointer]:
                - /url: "#cite_ref-4"
                - text: ↑
              - text: 留異余孝頃周迪等所在鋒起 「鋒起」各本作「蜂起」，《南史》、《元龜》四一二同。按鋒起言一時並起，勢銳不可當也。古書「鋒起」「蜂起」往往互出，如《後漢書·光武紀》「寇盜鋒起」，注「『鋒』字或作『蜂』」，即其例也。
            - listitem [ref=f5e250]:
              - link "跳转" [ref=f5e252] [cursor=pointer]:
                - /url: "#cite_ref-5"
                - text: ↑
              - text: 齊遣行臺慕容紹宗以眾三萬來攻鬱口諸鎮 錢大昕《廿二史考異》云：「按慕容紹宗之死在齊未受禪以前，安得此時尚存。此史家傳聞之誤，《南史》亦仍舊聞，而未據《北史》以正之。」
            - listitem [ref=f5e253]:
              - link "跳转" [ref=f5e255] [cursor=pointer]:
                - /url: "#cite_ref-6"
                - text: ↑
              - text: 梁內史始興藩王蕭毅以郡讓續 錢大昕《廿二史考異》云：「按梁書及南史，始興王憺薨，世子亮嗣，無名『毅』者。」張森楷校勘記亦云：「始興王憺嗣子亮于時尚存，不云名毅，未知毅為憺何人也。」
            - listitem [ref=f5e256]:
              - link "跳转" [ref=f5e258] [cursor=pointer]:
                - /url: "#cite_ref-7"
                - text: ↑
              - text: 余孝頃與琳黨李（希）〔孝〕欽等共圍周迪 據《南史》改。按〈黃法𣰋傳〉、〈周迪傳〉及》《北齊書·王琳傳》並作「李孝欽」。
            - listitem [ref=f5e259]:
              - link "跳转" [ref=f5e261] [cursor=pointer]:
                - /url: "#cite_ref-8"
                - text: ↑
              - text: 賜以女樂一部 「樂」各本並作「妓」。「一部」二字原缺，據各本補。
            - listitem [ref=f5e262]:
              - link "跳转" [ref=f5e264] [cursor=pointer]:
                - /url: "#cite_ref-9"
                - text: ↑
              - text: 遂貽喪仆 「仆」原作「什」，版刻之訛，今據《元龜》四五二、五九五改正。按北監本、汲本、殿本「仆」作「身」，疑後人妄改。
