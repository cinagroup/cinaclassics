      - generic [ref=f33e789]:
        - generic [ref=f33e790]:
          - generic [ref=f33e791]: 
          - text: 什么是部首？
        - generic [ref=f33e792]:
          - paragraph [ref=f33e793]: 部首是依照汉字型态和偏旁所分的门类，而所有汉字势必分类在某个部首中。
          - paragraph [ref=f33e794]:
            - text: 部首的概念由东汉文字学家许慎于公元100年（永元12年）所著之《
            - link "说文解字" [ref=f33e795] [cursor=pointer]:
              - /url: /zidian/shuowen
            - text: 》所创，共立540个部首。从此字书一般使用部首作为汉字的检字方式。之后的许多字书模仿《说文解字》，以部首来分类汉字。如《玉篇》（542个部首）、《类篇》（540个部首）等，它们使用的部首几乎与《
            - link "说文解字" [ref=f33e796] [cursor=pointer]:
              - /url: /zidian/shuowen
            - text: 》相同，不易检索的缺点仍在。
          - paragraph [ref=f33e797]:
            - text: 清朝康熙五十五年（1716年）成书的《
            - link "康熙字典" [ref=f33e798] [cursor=pointer]:
              - /url: /zidian/kangxi
            - text: 》的共214个部首，是后来大部分字典部首的蓝本，为了方便查询，部首跟笔划区分。
          - paragraph [ref=f33e799]: 部首原则上是表示一组文字的共通意义，部首所在位置并不固定。汉字的90%是形声字，形声字是由表示意义的“形符”与表示发音的“声符”组成的。形声字多使用意符为部首，有助于容易判断部首的部分。然而，会意字则是完全由“形符”所组成，所以难以判断何者为部首。
          - paragraph [ref=f33e800]:
            - text: 为求搜寻的方便，有些部首的归类与字义无关。例如按照原则，所有象形字都应该自成部首，但这样会造成很多象形文字的部首仅有这个字。所以像是“
            - link "甲" [ref=f33e801] [cursor=pointer]:
              - /url: /zidian/zi-30002
            - text: ”“
            - link "申" [ref=f33e802] [cursor=pointer]:
              - /url: /zidian/zi-30003
            - text: ”“
            - link "由" [ref=f33e803] [cursor=pointer]:
              - /url: /zidian/zi-30001
            - text: ”这些象形字，全部归类到“
            - link "田部" [ref=f33e804] [cursor=pointer]:
              - /url: /zidian/bushou-30000
            - text: ”。另外，甚至有“
            - link "亠部" [ref=f33e805] [cursor=pointer]:
              - /url: /zidian/bushou-20128
            - text: ”这种原先没有的文字，专做字形分类用而制造的部首。
          - paragraph [ref=f33e806]:
            - text: 偏旁是部首作为左旁或右旁时的称呼。例如“
            - link "心部" [ref=f33e807] [cursor=pointer]:
              - /url: /zidian/bushou-24515
            - text: ”作为左偏旁时，如“
            - link "情" [ref=f33e808] [cursor=pointer]:
              - /url: /zidian/zi-24773
            - text: ”“
            - link "性" [ref=f33e809] [cursor=pointer]:
              - /url: /zidian/zi-24615
            - text: ”“
            - link "憎" [ref=f33e810] [cursor=pointer]:
              - /url: /zidian/zi-24974
            - text: ”，会变形为三划的“忄”(忄是汉字部首，由“心”演变而来)。又称为“
            - link "竖心旁" [ref=f33e811] [cursor=pointer]:
              - /url: /zidian/bushou-24516
            - text: ”。放在文字下方时，有“
            - link "志" [ref=f33e812] [cursor=pointer]:
              - /url: /zidian/zi-24535
            - text: ”“
            - link "慕" [ref=f33e813] [cursor=pointer]:
              - /url: /zidian/zi-24917
            - text: ”两种外形。但这些变化都不妨碍其归入“
            - link "心部" [ref=f33e814] [cursor=pointer]:
              - /url: /zidian/bushou-24515
            - text: ”。
          - paragraph [ref=f33e815]:
            - text: 汉语国学网的汉语字典为您提供
            - link "汉语拼音" [ref=f33e816] [cursor=pointer]:
              - /url: /zidian/pinyin
            - text: 、
            - link "偏旁部首" [ref=f33e817] [cursor=pointer]:
              - /url: /zidian/bushou
            - text: 、
            - link "汉字笔画" [ref=f33e818] [cursor=pointer]:
              - /url: /zidian/bihua
            - text: 等不同的索引排序方式方便查字。
