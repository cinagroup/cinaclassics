                - text: ↑
              - text: 以驃騎將軍蕭摩訶 按本傳亦作「驃騎大將軍」，此脫「大」字，參校記一七。
            - listitem [ref=f1e420]:
              - link "跳转" [ref=f1e422] [cursor=pointer]:
                - /url: "#cite_ref-28"
                - text: ↑
              - text: 後主遣驃騎大將軍司徒豫章王叔英屯朝（室）〔堂〕「室」當作「堂」，各本並訛，今依〈豫章王叔英傳〉及《通鑑》改。
            - listitem [ref=f1e423]:
              - link "跳转" [ref=f1e425] [cursor=pointer]:
                - /url: "#cite_ref-29"
                - text: ↑
              - text: 惠以使下 「下」字原墨丁，據各本補。
            - listitem [ref=f1e426]:
              - link "跳转" [ref=f1e428] [cursor=pointer]:
                - /url: "#cite_ref-30"
                - text: ↑
              - text: 近古未之有也 「近古」二字原墨丁，據各本補。
            - listitem [ref=f1e429]:
              - link "跳转" [ref=f1e431] [cursor=pointer]:
                - /url: "#cite_ref-31"
                - text: ↑
              - text: 由乎數戰〔數勝〕據南監本、汲本、殿本補。
            - listitem [ref=f1e432]:
              - link "跳转" [ref=f1e434] [cursor=pointer]:
                - /url: "#cite_ref-32"
                - text: ↑
              - text: 文武之業 按張森楷〈校勘記〉云：「應作『武文』，武指高祖武皇帝，文指世祖文皇帝，武在先，文在後也。」
