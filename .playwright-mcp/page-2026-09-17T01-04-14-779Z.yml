          - paragraph [ref=f1e144]:
            - text: 後主諱叔寶，字元秀，小字黃奴，高宗嫡長子也。梁
            - link "承聖二年" [ref=f1e146] [cursor=pointer]:
              - /url: /wiki/Category:553%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: 十一月戊寅生于江陵。明年，江陵陷，高宗遷關右，留後主于穰城。
            - link "天嘉三年" [ref=f1e148] [cursor=pointer]:
              - /url: /wiki/Category:562%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: ，歸京師，立為安成王世子。
            - link "天康元年" [ref=f1e150] [cursor=pointer]:
              - /url: /wiki/Category:%E9%9C%80%E8%A6%81%E6%8C%87%E5%AE%9A%E5%85%AC%E5%85%83%E7%9A%84%E7%B4%80%E5%B9%B4
            - text: ，授寧遠將軍，置佐史。
            - link "光大二年" [ref=f1e152] [cursor=pointer]:
              - /url: /wiki/Category:568%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: ，為太子中庶子，尋遷侍中，餘如故。
            - link "太建元年" [ref=f1e154] [cursor=pointer]:
              - /url: /wiki/Category:569%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: 正月甲午，立為皇太子。
          - generic [ref=f1e155]:
            - heading "太建十四年" [level=2] [ref=f1e156]
            - generic [ref=f1e157]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B76&action=edit&section=1
          - paragraph [ref=f1e158]:
            - text: 十四年正月甲寅，高宗崩。乙卯，始興王叔陵作逆，伏誅。丁巳，太子即皇帝位于太極前殿。詔曰：「上天降禍，大行皇帝奄棄萬國，攀號擗踊，無所迨及。朕以哀煢，嗣膺寶歷，若涉巨川，罔知攸濟，方賴群公，用匡寡薄。思播遺德，覃被億兆，凡厥遐邇，咸與惟新。可大赦天下。在位文武及孝悌力田為父後者，並賜爵一級。孤老鰥寡不能自存者，賜穀人五斛、帛二匹。」癸亥，以侍中、翊前將軍、丹陽尹長沙王叔堅為驃騎將軍、開府儀同三司、揚州刺史，右衛將軍蕭摩訶為車騎將軍、南徐州刺史，
            - superscript [ref=f1e159]:
              - link "[1]" [ref=f1e160] [cursor=pointer]:
                - /url: "#cite_note-1"
            - text: 鎮西將軍、荊州刺史樊毅進號征西將軍，平南將軍、豫州刺史任忠進號鎮南將軍，
            - superscript [ref=f1e161]:
              - link "[2]" [ref=f1e162] [cursor=pointer]:
                - /url: "#cite_note-2"
            - text: 護軍將軍沈恪為特進、金紫光祿大夫，平西將軍魯廣達進號安西將軍，仁武將軍、豐州刺史章大寶為中護軍。乙丑，尊皇后為皇太后，宮曰弘範。景寅，以冠軍將軍晉熙王叔文為宣惠將軍、丹陽尹。丁卯，立弟叔重為始興王，
            - superscript [ref=f1e163]:
              - link "[3]" [ref=f1e164] [cursor=pointer]:
                - /url: "#cite_note-3"
            - text: 奉昭烈王祀。己巳，立妃沈氏為皇后。辛未，立皇弟叔儼為尋陽王，皇弟叔慎為岳陽王，
            - superscript [ref=f1e165]:
              - link "[4]" [ref=f1e166] [cursor=pointer]:
                - /url: "#cite_note-4"
            - text: 皇弟叔達為義陽王，皇弟叔熊為巴山王，
            - superscript [ref=f1e167]:
              - link "[5]" [ref=f1e168] [cursor=pointer]:
                - /url: "#cite_note-5"
            - text: 皇弟叔虞為武昌王。壬申，侍中、中權將軍、開府儀同三司鄱陽王伯山進號中權大將軍，軍師將軍、尚書左僕射晉安王伯恭進號翊前將軍、侍中，翊右將軍、中領軍廬陵王伯仁進號安前將軍，
            - superscript [ref=f1e169]:
              - link "[6]" [ref=f1e170] [cursor=pointer]:
                - /url: "#cite_note-6"
            - text: 鎮南將軍、江州刺史豫章王叔英進號征南將軍，平南將軍、湘州刺史建安王叔卿進號安南將軍。以侍中、中書監、安右將軍徐陵為左光祿大夫，領太子少傅。甲戌，設無㝵大會於太極前殿。
          - paragraph [ref=f1e171]:
            - text: 三月辛亥，詔曰：「躬推為勸，義顯前經，力農見賞，事昭往誥。斯乃國儲是資，民命攸屬，豐儉隆替，靡不由之。夫入賦自古，輸惟舊，沃饒貴于十金，磽确至於三易，腴塉既異，盈縮不同。詐偽日興，簿書歲改。稻田使者，著自西京，不實峻刑，聞諸東漢。老農懼於祇應，俗吏因以侮文。輟耒成群，游手為伍，永言妨蠹，良可太息。今陽和在節，膏澤潤下，宜展春耨，以望秋坻。其有新辟塍畎，進墾蒿萊，廣袤勿得度量，征租悉皆停免。私業久廢，咸許占作，公田荒縱，亦隨肆勤。儻良守教耕，淳民載酒，有茲督課，議以賞擢。外可為格班下，稱朕意焉。」癸亥，詔曰：「夫體國經野，長世字氓，雖因革儻殊，弛張或異，至於旁求俊乂，爰逮側微，用適和羹，是隆大厦，上智中主，咸由此術。朕以寡薄，嗣膺景祚，雖哀疚在躬，情慮惛舛，而宗社任重，黎庶務殷，無由自安拱默，敢忘康濟，思所以登顯髦彥，式備周行。但空勞宵夢，屢勤史卜，五就莫來，（五）〔八〕能不至。
            - superscript [ref=f1e172]:
              - link "[7]" [ref=f1e173] [cursor=pointer]:
                - /url: "#cite_note-7"
            - text: 是用（甲）〔申〕旦凝慮，
            - superscript [ref=f1e174]:
              - link "[8]" [ref=f1e175] [cursor=pointer]:
                - /url: "#cite_note-8"
            - text: 景夜損懷。
            - superscript [ref=f1e176]:
              - link "[9]" [ref=f1e177] [cursor=pointer]:
                - /url: "#cite_note-9"
            - text: 豈以食玉炊桂，無因自達？將懷寶迷邦，咸思獨善？應內外眾官九品已上，可各薦一人，以會彙征之旨。且取備實難，舉長或易，小大之用，明言所施，勿得南箕北斗，名而非實。其有負能仗氣，擯壓當時，著賓戲以自憐，草客嘲以慰志，人生一世，逢遇誠難，亦宜去此幽谷，翔茲天路，趨銅駝以觀國，望金馬而來庭，便當隨彼方圓，飭之矩矱。」又詔曰：「昔睿后宰民，哲王御宇，雖德稱汪濊，明能普燭，猶復紆己乞言，降情訪道，高咨岳牧，下聽輿臺，故能政若神明，事無悔吝。朕纂承丕緒，思隆大業，常懼九重已邃，四聰未廣，欲聽昌言，不疲痺足，若逢廷折，無憚批鱗。而口柔之辭，儻聞於在位，腹誹之意，或隱於具僚，非所以弘理至公，緝熙帝載者也。內外卿士文武眾司，若有智周政術，心練治體，救民俗之疾苦，辯禁網之疏密者，各進忠讜，無所隱諱。朕將虛己聽受，擇善而行，庶深鑒物情，匡我王度。」己巳，以侍中、尚書左僕射、新除翊前將軍晉安王伯恭為安南將軍、湘州刺史，新除翊左將軍、永陽王伯智為尚書僕射，中護軍章大寶為豐州刺史。
          - paragraph [ref=f1e178]: 夏四月景申，立皇子永康公胤為皇太子，賜天下為父後者爵一級，王公已下賚帛各有差。庚子，詔曰：「朕臨御區宇，撫育黔黎，方欲康濟澆薄，蠲省繁費，奢僭乖衷，實宜防斷。應鏤金銀薄及庶物化生土木人綵花之屬，及布帛幅尺短狹輕疏者，並傷財廢業，尤成蠹患。又僧尼道士，挾邪左道，不依經律，民間淫祀祅書諸珍怪事，詳為條制，並皆禁絕。」癸卯，詔曰：「中歲克定淮、泗，爰涉青、徐，彼土酋豪，並輸罄誠款，分遣親戚，以為質任。今舊土淪陷，復成異域，南北阻遠，未得會同，念其分乖，殊有愛戀。夷狄吾民，斯事一也，何獨譏禁，使彼離析？外可即檢任子館及東館並帶保任在外者，並賜衣糧，頒之酒食，遂其鄉路，所之阻遠，便發遣船仗衛送，必令安達。若已預仕宦及別有事義不欲去者，亦隨其意。」
          - paragraph [ref=f1e179]: 六月癸酉朔，以明威將軍、通直散騎常侍孫瑒為中護軍。
          - paragraph [ref=f1e180]: 秋七月辛未，大赦天下。是月，江水色赤如血，自京師至于荊州。
          - paragraph [ref=f1e181]: 八月癸未夜，天有聲如風水相撀。乙酉夜亦如之。景戌，以使持節、都督緣江諸軍事、安西將軍魯廣達為安左將軍。
          - paragraph [ref=f1e182]: 九月景午，設無㝵大會於太極殿，捨身及乘輿御服，大赦天下。辛亥夜，天東北有聲如蟲飛，漸移西北。乙卯，太白晝見。景寅，以驃騎將軍、開府儀同三司、揚州刺史長沙王叔堅為司空，征南將軍、江州刺史豫章王叔英即本號開府儀同三司。
          - generic [ref=f1e183]:
            - heading "至德元年" [level=2] [ref=f1e184]
            - generic [ref=f1e185]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B76&action=edit&section=2
          - paragraph [ref=f1e186]:
            - link "至德元年" [ref=f1e188] [cursor=pointer]:
              - /url: /wiki/Category:583%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: 春正月壬寅，詔曰：「朕以寡薄，嗣守鴻基，哀惸切慮，疹恙纏織，訓俗少方，臨下靡筭，懼甚踐冰，慄同馭朽。而四氣易流，三光遄至，纓紱列陛，玉帛充庭，具物匪新，節序疑舊，緬思前德，永慕昔辰，對軒闥而哽心，顧扆筵而慓氣。思所以仰遵遺構，俯勵薄躬，陶鑄九流，休息百姓，用弘寬簡，取協陽和。可大赦天下，改太建十五年為至德元年。」以征南將軍、江州刺史、新除開府儀同三司豫章王叔英為中衛大將軍，驃騎將軍、開府儀同三司、揚州刺史長沙王叔堅為江州刺史，征東將軍、開府儀同三司、東揚州刺史司馬消難進號車騎將軍，宣惠將軍、丹陽尹晉熙王叔文為揚州刺史，鎮南將軍、南豫州刺史任忠為領軍將軍，安左將軍魯廣達為平南將軍、南豫州刺史，祠部尚書江總為吏部尚書。癸卯，立皇子深為始安王。
          - paragraph [ref=f1e189]: 二月丁丑，以始興王叔重為揚州刺史。
          - paragraph [ref=f1e190]: 夏四月戊辰，交州刺史李幼榮獻馴象。己丑，以前輕車將軍、揚州刺史晉熙王叔文為江州刺史。
          - paragraph [ref=f1e191]: 秋八月丁卯，以驃騎將軍、開府儀同三司長沙王叔堅為司空。
          - paragraph [ref=f1e192]: 九月丁巳，天東南有聲如蟲飛。
          - paragraph [ref=f1e193]: 冬十月丁酉，立皇弟叔平為湘東王，叔敖為臨賀王，叔宣為陽山王，叔穆為西陽王。戊戌，侍中、安右將軍、左光祿大夫、太子少傅徐陵卒。癸丑，立皇弟叔儉為南安王，叔澄為南郡王，叔興為沅陵王，叔韶為岳山王，叔純為新興王。
          - paragraph [ref=f1e194]: 十二月景辰，頭和國遣使獻方物。司空長沙王叔堅有罪免。戊午夜，天開自西北至東南，其內有青黃色，隆隆若雷聲。
          - generic [ref=f1e195]:
            - heading "至德二年" [level=2] [ref=f1e196]
            - generic [ref=f1e197]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B76&action=edit&section=3
          - paragraph [ref=f1e198]:
            - text: 二年春正月丁卯，分遣大使巡省風俗。平南將軍、豫州刺史魯廣達進號安南將軍。
            - superscript [ref=f1e199]:
              - link "[10]" [ref=f1e200] [cursor=pointer]:
                - /url: "#cite_note-10"
            - text: 癸巳，大赦天下。
          - paragraph [ref=f1e201]: 夏五月戊子，以尚書僕射永陽王伯智為平東將軍、東揚州刺史，輕車將軍、江州刺史晉熙王叔文為信威將軍、湘州刺史，仁威將軍、揚州刺史始興王叔重為江州刺史，信武將軍、南琅邪彭城二郡太守南平王嶷為揚州刺史，吏部尚書江總為尚書僕射。
          - paragraph [ref=f1e202]: 秋七月戊辰，以長沙王叔堅為侍中、鎮左將軍。壬午，太子加元服，在位文武賜帛各有差，孝悌力田為父後者各賜一級，鰥寡癃老不能自存者人穀五斛。
          - paragraph [ref=f1e203]: 九月癸未，太白晝見。
          - paragraph [ref=f1e204]: 冬十月己酉，詔曰：「耕鑿自足，乃曰淳風，貢賦之興，其來尚矣。蓋由庚極務，不獲已而行焉。但法令滋章，姦盜多有，俗尚澆詐，政鮮惟良。朕日旰夜分，矜一物之失所，泣辜罪己，愧三千之未措。望訂初下，使彊蔭兼出，如聞貧富均起，單弱重弊，斯豈振窮扇暍之意歟？是乃下吏箕斂之苛也。故云『百姓不足，君孰與足』。自太建十四年望訂租調逋未入者，並悉原除。在事百僚，辯斷庶務，必去取平允，無得便公害民，為己聲績，妨紊政道。」
          - paragraph [ref=f1e205]: 十一月景寅，大赦天下。壬申，盤盤國遣使獻方物。戊寅，百濟國遣使獻方物。
          - generic [ref=f1e206]:
            - heading "至德三年" [level=2] [ref=f1e207]
            - generic [ref=f1e208]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B76&action=edit&section=4
          - paragraph [ref=f1e209]: 三年春正月戊午朔，日有蝕之。庚午，以鎮左將軍長沙王叔堅即本號開府儀同三司，征西將軍、荊州刺史樊毅為護軍將軍，守吏部尚書、領著作陸瓊為吏部尚書，金紫光祿大夫袁敬加特進。
          - paragraph [ref=f1e210]: 三月辛酉，前豐州刺史章大寶舉兵反。
          - paragraph [ref=f1e211]: 夏四月庚戌，豐州義軍主陳景詳斬大寶，傳首京師。
          - paragraph [ref=f1e212]:
            - text: 秋八月戊子夜，老人星見。己酉，以左民尚書謝（伸）〔伷〕為吏部尚書。
            - superscript [ref=f1e213]:
              - link "[11]" [ref=f1e214] [cursor=pointer]:
                - /url: "#cite_note-11"
          - paragraph [ref=f1e215]: 九月甲戌，特進、金紫光祿大夫袁敬卒。
          - paragraph [ref=f1e216]: 冬十月己丑，丹丹國遣使獻方物。
          - paragraph [ref=f1e217]: 十一月己未，詔曰：「宣尼誕膺上哲，體資至聖，祖述憲章之典，並天地而合德，樂正雅頌之奧，與日月而偕明，垂後昆之訓範，開生民之耳目。梁季湮微，靈寢忘處，鞠為茂草，三十餘年，敬仰如在，永惟愾息。今雅道雍熙，由庚得所，斷琴故履，零落不追，閱笥開書，無因循復。外可詳之禮典，改築舊廟，蕙房桂棟，咸使惟新，芳蘩潔潦，以時饗奠。」辛巳，輿駕幸長干寺，大赦天下。
          - paragraph [ref=f1e218]: 十二月丙戌，太白晝見。辛卯，皇太子出太學，講孝經，戊戌，講畢。辛丑，釋奠于先師，禮畢，設金石之樂，會宴王公卿士。癸卯，高麗國遣使獻方物。
          - paragraph [ref=f1e219]: 是歲，蕭巋死，子琮代立。
          - generic [ref=f1e220]:
            - heading "至德四年" [level=2] [ref=f1e221]
            - generic [ref=f1e222]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B76&action=edit&section=5
          - paragraph [ref=f1e223]:
            - text: 四年春正月甲寅，詔曰：「堯施諫鼓，禹拜昌言，求之異等，久著前𣑨，
            - superscript [ref=f1e224]:
              - link "[12]" [ref=f1e225] [cursor=pointer]:
                - /url: "#cite_note-12"
            - text: 舉以淹滯，復聞昔典，斯乃治道之深規，帝王之切務。朕以寡昧，丕承鴻緒，未明虛己，日旰興懷，萬機多紊，四聰弗（遠）〔達〕，
            - superscript [ref=f1e226]:
              - link "[13]" [ref=f1e227] [cursor=pointer]:
                - /url: "#cite_note-13"
            - text: 思聞蹇諤，採其謀計。王公已下，各薦所知，旁詢管庫，爰及輿皁，一介有能，片言可用，朕親加聽覽，佇於啟沃。」中權大將軍、開府儀同三司鄱陽王伯山進號鎮衛將軍，中衛大將軍、開府儀同三司豫章王叔英進號驃騎大將軍，
            - superscript [ref=f1e228]:
              - link "[14]" [ref=f1e229] [cursor=pointer]:
                - /url: "#cite_note-14"
            - text: 鎮左將軍、開府儀同三司長沙王叔堅進號中軍大將軍，安南將軍晉安王伯恭進號鎮右將軍，翊右將軍宜都王叔明進號安右將軍。
          - paragraph [ref=f1e230]: 二月景戌，以鎮右將軍晉安王伯恭為特進。景申，立皇弟叔謨為巴東王，叔顯為臨江王，叔坦為新會王，叔隆為新寧王。
          - paragraph [ref=f1e231]: 夏五月丁巳，立皇子莊為會稽王。
          - paragraph [ref=f1e232]:
            - text: 秋九月甲午，輿駕幸玄武湖，肆艫艦閱武，
            - superscript [ref=f1e233]:
              - link "[15]" [ref=f1e234] [cursor=pointer]:
                - /url: "#cite_note-15"
            - text: 宴群臣賦詩。戊戌，以鎮衛將軍、開府儀同三司鄱陽王伯山為東揚州刺史，智武將軍岳陽王叔慎為丹陽尹。丁未，百濟國遣使獻方物。
          - paragraph [ref=f1e235]: 冬十月癸亥，尚書僕射江總為尚書令，吏部尚書謝伷為尚書僕射。
          - paragraph [ref=f1e236]: 十一月己卯，詔曰：「惟刑止暴，惟德成物，三才是資，百王不改。而世無抵角，時鮮犯鱗，渭橋驚馬，弗聞廷爭，桃林逸牛，未見其旨。雖剽悍輕侮，理從鉗釱，憃愚杜默，宜肆矜弘，政乏良哉，明慚則哲，求諸刑措，安可得乎？是用屬寤寐以軫懷，負黼扆而於邑。復茲合璧輪缺，連珠緯舛，黃鍾獻呂，和氣始萌，玄英告中，履長在御，因時宥過，抑乃斯得。可大赦天下。」
          - generic [ref=f1e237]:
            - heading "禎明元年" [level=2] [ref=f1e238]
            - generic [ref=f1e239]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B76&action=edit&section=6
          - paragraph [ref=f1e240]:
            - link "禎明元年" [ref=f1e242] [cursor=pointer]:
              - /url: /wiki/Category:587%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: 春正月景子，以安前將軍衡陽王伯信進號鎮前將軍，安東將軍、吳興太守廬陵王伯仁為特進，
            - superscript [ref=f1e243]:
              - link "[16]" [ref=f1e244] [cursor=pointer]:
                - /url: "#cite_note-16"
            - text: 智武將軍、丹陽尹岳陽王叔慎為湘州刺史，仁武將軍義陽王叔達為丹陽尹。戊寅，詔曰：「柏皇、大庭，鼓淳和於曩日，姬王、嬴后，被澆風於末載，刑書已鑄，善化匪融，禮義既乖，姦宄斯作。何其淳朴不反，浮華競扇者歟？朕居中御物，納隍在睠，頻恢天網，屢絕三邊，元元黔庶，終罹五辟。蓋乃康哉寡薄，抑焉法令滋章。是用當宁弗怡，矜此向隅之意。今三元具序，萬國朝辰，靈芝獻於始陽，膏露凝於聿歲，從春施令，仰乾布德，思與九有，惟新七政。可大赦天下，改至德五年為禎明元年。」乙未，地震。癸卯，以鎮前將軍衡陽王伯信為鎮南將軍、西衡州刺史。
          - paragraph [ref=f1e245]: 二月丁未，以特進、鎮右將軍晉安王伯恭進號中衛將軍，中書令建安王叔卿為中書監。丁卯，詔至德元年望訂租調逋未入者，並原之。
          - paragraph [ref=f1e246]:
            - text: 秋八月癸卯，老人星見。丁未，以車騎將軍蕭摩訶為驃騎將軍。
            - superscript [ref=f1e247]:
              - link "[17]" [ref=f1e248] [cursor=pointer]:
                - /url: "#cite_note-17"
          - paragraph [ref=f1e249]:
            - text: 九月乙亥，以驃騎將軍、開府儀同三司豫章王叔英為驃騎大將軍。庚寅，蕭琮所署尚書令、太傅安平王蕭巖，
            - superscript [ref=f1e250]:
              - link "[18]" [ref=f1e251] [cursor=pointer]:
                - /url: "#cite_note-18"
            - text: 中軍將軍、荊州刺史義興王蕭瓛，
            - superscript [ref=f1e252]:
              - link "[19]" [ref=f1e253] [cursor=pointer]:
                - /url: "#cite_note-19"
            - text: 遣其都官尚書沈君公，詣荊州刺史陳紀請降。
            - superscript [ref=f1e254]:
              - link "[20]" [ref=f1e255] [cursor=pointer]:
                - /url: "#cite_note-20"
            - text: 辛卯，巖等率文武男女十萬餘口濟江。甲午，大赦天下。
          - paragraph [ref=f1e256]: 冬十一月乙亥，割揚州吳郡置吳州，割錢塘縣為郡，屬焉。景子，以蕭巖為平東將軍、開府儀同三司、東揚州刺史，蕭瓛為安東將軍、吳州刺史。丁亥，以驃騎大將軍、開府儀同三司豫章王叔英兼司徒。
          - paragraph [ref=f1e257]:
            - text: 十二月景辰，以前鎮衛將軍、開府儀同三司、東揚州刺史鄱陽王伯山為鎮衛大將軍、開府儀同三司，
            - superscript [ref=f1e258]:
              - link "[21]" [ref=f1e259] [cursor=pointer]:
                - /url: "#cite_note-21"
            - text: 前中衛將軍晉安王伯恭為中衛將軍、右光祿大夫。
          - generic [ref=f1e260]:
            - heading "禎明二年" [level=2] [ref=f1e261]
            - generic [ref=f1e262]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B76&action=edit&section=7
          - paragraph [ref=f1e263]: 二年春正月辛巳，立皇子恮為東陽王，恬為錢塘王。是月，遣散騎常侍周羅帥兵屯峽口。
          - paragraph [ref=f1e264]:
            - text: 夏四月戊申，有群鼠無數，自〔蔡〕洲岸入石頭渡淮，
            - superscript [ref=f1e265]:
              - link "[22]" [ref=f1e266] [cursor=pointer]:
                - /url: "#cite_note-22"
            - text: 至于青塘兩岸，數日死，隨流出江。戊午，以左民尚書蔡徵為吏部尚書。是月，郢州南浦水黑如墨。
          - paragraph [ref=f1e267]:
            - text: 五月壬午，以安前將軍廬陵王伯仁為特進。甲午，東冶鑄鐵，有物赤色如數斗，
            - superscript [ref=f1e268]:
              - link "[23]" [ref=f1e269] [cursor=pointer]:
                - /url: "#cite_note-23"
            - text: 自天墜鎔所，有聲隆隆如雷，鐵飛出牆外燒民家。
          - paragraph [ref=f1e270]:
            - text: 六月戊戌，扶南國遣使獻方物。庚子，廢皇太子胤為吳興王，立軍師將軍、揚州刺史始安王深為皇太子。辛丑，平南將軍、江州刺史南平王嶷進號鎮南將軍；忠武將軍、南徐州刺史永嘉王彥進號安北將軍；會稽王莊為翊前將軍、揚州刺史；宣惠將軍、尚書令江總進號中權將軍；雲麾將軍、太子詹事袁憲為尚書僕射；尚書僕射謝伷為特進；寧遠將軍、新除吏部尚書蔡徵進號安右將軍。甲辰，以安右將軍魯廣達為中領軍。
            - superscript [ref=f1e271]:
              - link "[24]" [ref=f1e272] [cursor=pointer]:
                - /url: "#cite_note-24"
            - text: 丁巳，大風至自西北激濤水入石頭城，淮渚暴溢，漂沒舟乘。
          - paragraph [ref=f1e273]: 冬十月己亥，立皇子蕃為吳郡王。辛丑，以度支尚書、領大著作姚察為吏部尚書。己酉，輿駕幸莫府山，大校獵。
          - paragraph [ref=f1e274]:
            - text: 十一月丁卯，詔曰：「夫議獄緩刑，皇王之所垂範，勝殘去殺，仁人之所用心。自畫冠既息，刻吏斯起，法令滋章，手足無措。朕君臨區宇，屬當澆末，輕重之典，在政未康，小大之情，興言多愧。眷茲狴犴，有軫哀矜，可克日於大政殿訊獄。」壬申，以鎮南將軍、江州刺史南平王嶷為征西將軍、郢州刺史，安北將軍、南徐州刺史永嘉王彥為安南將軍、江州刺史，軍師將軍南海王虔為安北將軍、南徐州刺史。
            - superscript [ref=f1e275]:
              - link "[25]" [ref=f1e276] [cursor=pointer]:
                - /url: "#cite_note-25"
            - text: 景子，立皇弟叔榮為新昌王，叔匡為太原王。是月，隋遣晉王廣眾軍來伐，自巴、蜀、沔、漢下流至廣陵，數十道俱入，緣江鎮戍，相繼奏聞。時新除湘州刺史施文慶、中書舍人沈客卿掌機密用事，並抑而不言，故無備禦。
          - generic [ref=f1e277]:
            - heading "禎明三年" [level=2] [ref=f1e278]
            - generic [ref=f1e279]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B76&action=edit&section=8
          - paragraph [ref=f1e280]:
            - text: 三年春正月乙丑朔，霧氣四塞。是日，隋總管賀若弼自北道廣陵濟京口，總管韓擒虎趨橫江，
            - superscript [ref=f1e281]:
              - link "[26]" [ref=f1e282] [cursor=pointer]:
                - /url: "#cite_note-26"
            - text: 濟採石，自南道將會弼軍。景寅，採石戍主徐子建馳啟告變。丁卯，召公卿入議軍旅。戊辰，內外戒嚴，以驃騎將軍蕭摩訶、
            - superscript [ref=f1e283]:
              - link "[27]" [ref=f1e284] [cursor=pointer]:
                - /url: "#cite_note-27"
            - text: 護軍將軍樊毅、中領軍魯廣達並為都督，遣南豫州刺史樊猛帥舟師出白下，散騎常侍皋文奏將兵鎮南豫州。庚午，賀若弼攻陷南徐州。辛未，韓擒虎又陷南豫州，文奏敗還。至是隋軍南北道並進。後主遣驃騎大將軍、司徒豫章王叔英屯朝（室）〔堂〕，
            - superscript [ref=f1e285]:
              - link "[28]" [ref=f1e286] [cursor=pointer]:
                - /url: "#cite_note-28"
            - text: 蕭摩訶屯樂遊苑，樊毅屯耆闍寺，魯廣達屯白土岡，忠武將軍孔範屯寶田寺。己卯，鎮東大將軍任忠自吳興入赴，仍屯朱雀門。辛巳，賀若弼進據鍾山，頓白土岡之東南。甲申，後主遣眾軍與弼合戰，眾軍敗績。弼乘勝至樂遊苑，魯廣達猶督散兵力戰，不能拒。弼進攻宮城，燒北掖門。是時韓擒虎率眾自新林至于石子岡，任忠出降於擒虎，仍引擒虎經朱雀航趣宮城，自南掖門而入。於是城內文武百司皆遁出，唯尚書僕射袁憲在殿內。尚書令江總、吏部尚書姚察、度支尚書袁權、前度支尚書王瑗、侍中王寬居省中。後主聞兵至，從宮人十餘出後堂景陽殿，將自投于井，袁憲侍側，苦諫不從，後閤舍人夏侯公韻又以身蔽井，後主與爭久之，方得入焉。及夜，為隋軍所執。景戌，晉王廣入據京城。
          - paragraph [ref=f1e287]:
            - text: 三月己巳，後主與王公百司發自建鄴，入于長安。隋
            - link "仁壽四年" [ref=f1e289] [cursor=pointer]:
              - /url: /wiki/Category:%E9%9C%80%E8%A6%81%E6%8C%87%E5%AE%9A%E5%85%AC%E5%85%83%E7%9A%84%E7%B4%80%E5%B9%B4
            - text: 十一月壬子，薨於洛陽，時年五十二。追贈大將軍，封長城縣公，謚曰煬，葬河南洛陽之芒山。
          - generic [ref=f1e290]:
            - heading "【史評】" [level=2] [ref=f1e291]
            - generic [ref=f1e292]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B76&action=edit&section=9
          - paragraph [ref=f1e293]: 史臣侍中鄭國公魏徵曰：
          - blockquote [ref=f1e294]:
            - paragraph [ref=f1e295]: 高祖拔起壟畝，有雄桀之姿。始佐下藩，奮英奇之略，弭節南海，職思靜亂。援旗北邁，義在勤王，掃侯景於既成，拯梁室於已墜。天網絕而復續，國步屯而更康，百神有主，不失舊物。魏王之延漢鼎祚，宋武之反晉乘輿，懋績鴻勳，無以尚也。于時內難未弭，外鄰勍敵，王琳作梗於上流，周、齊搖蕩於江、漢，畏首畏尾，若存若亡，此之不圖，遽移天歷，雖皇靈有睠，何其速也？然志度弘遠，懷抱豁如，或取士於仇讎，或擢才於亡命，掩其受金之過，宥其吠堯之罪，委以心腹爪牙，咸能得其死力，故乃決機百勝，成此三分，方諸鼎峙之雄，足以無慚權、備矣。
            - paragraph [ref=f1e296]: 世祖天姿叡哲，清明在躬，早預經綸，知民疾苦，思擇令典，庶幾至治。德刑並用，戡濟艱虞，群凶授首，彊鄰震懾。雖忠厚之化未能及遠，恭儉之風足以垂訓，若不尚明察，則守文之良主也。
            - paragraph [ref=f1e297]: 臨川年長於成王，過微於太甲。宣帝有周公之親，無伊尹之志，明辟不復，桐宮遂往，欲加之罪，其無辭乎！
            - paragraph [ref=f1e298]:
              - text: 高宗爰自在田，雅量宏廓，登庸御極，民歸其厚。惠以使下，
              - superscript [ref=f1e299]:
                - link "[29]" [ref=f1e300] [cursor=pointer]:
                  - /url: "#cite_note-29"
              - text: 寬以容眾。智勇爭奮，師出有名，揚旆分麾，風行電掃，辟土千里，奄有淮、泗，戰勝攻取之勢，近古未之有也。
              - superscript [ref=f1e301]:
                - link "[30]" [ref=f1e302] [cursor=pointer]:
                  - /url: "#cite_note-30"
              - text: 既而君侈民勞，將驕卒墮，帑藏空竭，折衄師徒，於是秦人方彊，遂窺兵於江上矣。李克以為吳之先亡，由乎數戰〔數勝〕，
              - superscript [ref=f1e303]:
                - link "[31]" [ref=f1e304] [cursor=pointer]:
                  - /url: "#cite_note-31"
              - text: 數戰則民疲，數勝則主驕，以驕主御疲民，未有不亡者也。信哉言乎！高宗始以寬大得人，終以驕侈致敗，文、武之業，
              - superscript [ref=f1e305]:
                - link "[32]" [ref=f1e306] [cursor=pointer]:
                  - /url: "#cite_note-32"
              - text: 墜于茲矣。
            - paragraph [ref=f1e307]: 後主生深宮之中，長婦人之手，既屬邦國殄瘁，不知稼穡艱難。初懼阽危，屢有哀矜之詔，後稍安集，復扇淫侈之風。賓禮諸公，唯寄情於文酒，昵近群小，皆委之以衡軸。謀謨所及，遂無骨鯁之臣，權要所在，莫匪侵漁之吏。政刑日紊，尸素盈朝，耽荒為長夜之飲，嬖寵同豔妻之孽，危亡弗恤，上下相蒙，眾叛親離，臨機不寤，自投於井，冀以苟生，視其以此求全，抑亦民斯下矣。
            - paragraph [ref=f1e308]: 遐觀列辟，纂武嗣興，其始也皆欲齊明日月，合德天地，高視五帝，俯協三王，然而靡不有初，克終蓋寡，其故何哉？並以中庸之才，懷可移之性，口存於仁義，心怵於嗜慾。仁義利物而道遠，嗜欲遂性而便身。便身不可久違，道遠難以固志。佞諂之倫，承顏候色，因其所好，以悅導之，若下阪以走丸，譬順流而決壅。非夫感靈辰象，降生明德，孰能遺其所樂，而以百姓為心哉？此所以成、康、文、景千載而罕遇，癸、辛、幽、厲靡代而不有，毒被宗社，身嬰戮辱，為天下笑，可不痛乎！古人有言，亡國之主，多有才蓺，考之梁、陳及隋，信非虛論。然則不崇教義之本，偏尚淫麗之文，徒長澆偽之風，無救亂亡之禍矣。
          - paragraph [ref=f1e309]: 史臣曰：後主昔在儲宮，早標令德，及南面繼業，寔允天人之望矣。至於禮樂刑政，咸遵故典，加以深弘六藝，廣辟四門，是以待詔之徒，爭趨金馬，稽古之秀，雲集石渠。且梯山航海，朝貢者往往歲至矣。自魏正始、晉中朝以來，貴臣雖有識治者，皆以文學相處，罕關庶務，朝章大典，方參議焉，文案簿領，咸委小吏，浸以成俗，迄至于陳。後主因循，未遑改革，故施文慶、沈客卿之徒，專掌軍國要務，姦黠左道，以裒刻為功，自取身榮，不存國計，是以朝經墮廢，禍生鄰國。斯亦運鐘百六，鼎玉遷變，非唯人事不昌，蓋天意然也。
