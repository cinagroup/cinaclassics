                  - paragraph [ref=f7e141]: 周弘正 袁憲
          - generic [ref=f7e142]:
            - heading "周弘正" [level=2] [ref=f7e143]
            - generic [ref=f7e144]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B724&action=edit&section=1
          - paragraph [ref=f7e145]: 周弘正字思行，汝南安城人（也），〔一〕晉光祿大夫顗之九世孫也。祖顒，齊中書侍郎，領著作。父寶始，梁司徒祭酒。
          - paragraph [ref=f7e146]: 弘正幼孤，及弟弘讓、弘直，俱為（叔）〔伯〕父侍中護軍捨所養。〔二〕年十歲，通老子、周易，捨每與談論，輒異之，曰：「觀汝神情穎晤，清理警發，後世知名，當出吾右。」河東裴子野深相賞納，請以女妻之。十五，召補國子生，仍於國學講周易，諸生傳習其義。以季春入學，孟冬應舉，學司以其日淺，弗之許焉。博士到洽議曰：「周郎年未弱冠，便自講一經，雖曰諸生，實堪師表，無俟策試。」起家梁太學博士。晉安王為丹陽尹，引為主簿。出為鄴令，〔三〕丁母憂去職。服闋，歷曲阿、安吉令。普通中，初置司文義郎，直壽光省，以弘正為司義侍郎。
          - paragraph [ref=f7e147]: 〔中〕大通（二）〔三〕年，梁昭明太子薨，〔四〕其嗣華容公不得立，乃以晉安王為皇太子，弘正乃奏記曰：
          - definition [ref=f7e149]: 竊聞撝謙之象，起於羲、軒爻畫，揖讓之源，生於堯、舜禪受，其來尚矣，可得而詳焉。夫以廟堂、汾水，殊途而同歸，稷、契、巢、許，異名而一貫，出者稱為元首，處者謂之外臣，莫不內外相資，表裏成治，斯蓋萬代同規，百王不易者也。暨于三王之世，寖以陵夷，各親其親，各子其子。乃至七國爭雄，劉項競逐，皇漢扇其俗，有晉揚其波，謙讓之道廢，多歷年所矣。夫文質遞變，澆淳相革，還樸反古，今也其時。
          - definition [ref=f7e151]: 伏惟明大王殿下，天挺將聖，聰明神武，百辟冠冕，四海歸仁。是以皇上發德音，下明詔，以大王為國之儲副，乃天下之本焉。雖復夏啟、周誦，漢儲、魏兩，此數君者，安足為大王道哉。意者願聞殿下抗目夷上仁之義，執子臧大賢之節，逃玉輿而弗乘，棄萬乘如脫屣，庶改澆競之俗，以大吳國之風。古有其人，今聞其語，能行之者，非殿下而誰？能使無為之化，復興於（遂）〔邃〕古，〔五〕讓王之道，不墜於來葉，豈不盛歟！豈不盛歟！
          - definition [ref=f7e153]: 弘正陋學書生，義慚稽古，家自汝、潁，世傳忠烈，先人決曹掾燕抗辭九諫，高節萬乘，正色三府，雖盛德之業將絕，而狂直之風未墜。是以敢布腹心，肆其愚瞽。如使芻言野說，少陳於聽覽，縱復委身烹鼎之下，絕命肺石之上，雖死之日，猶生之年。
          - paragraph [ref=f7e154]: 其抗直守正，皆此類也。
          - paragraph [ref=f7e155]: 累遷國子博士。時於城西立士林館，弘正居以講授，聽者傾朝野焉。弘正啟梁武帝周易疑義五十條，又請釋乾坤二繫曰：「臣聞易稱立象以盡意，繫辭以盡言，然後知聖人之情，幾可見矣。自非含微體極，盡化窮神，豈能通志成務，探賾致遠。而宣尼比之桎梏，絕韋編於漆字，軒轅之所聽瑩，遺玄珠於赤水。伏惟陛下一日萬機，匪勞神於瞬息，凝心妙本，常自得於天真，聖智無以隱其幾深，明神無以淪其不測。至若爻畫之苞於六經，文辭之窮於兩繫，名儒劇談以歷載，鴻生抵掌以終年，莫有試遊其藩，未嘗一見其涘。自制旨降談，裁成易道，析至微於秋毫，渙曾冰於幽谷。臣親承音旨，職司宣授，後進詵詵，不無傳業。但乾坤之蘊未剖，繫表之妙莫詮，使一經深致，尚多所惑。臣不涯庸淺，輕率短陋，謹與受業諸生清河張譏等三百一十二人，於乾坤二繫象爻未啟，伏願聽覽之閑，曲垂提訓，得使微臣鑽仰，成其篤習，後昆好事，專門有奉。自惟多幸，懽沐道於堯年，肄業終身，不知老之將至。天尊不聞，而冒陳請，冰谷寘懷，罔識攸厝。」詔答曰：「設卦觀象，事遠文高，作繫表言，辭深理奧，東魯絕編之思，西伯幽憂之作，事逾三古，人更七聖，自商瞿稟承，子庸傳授，篇簡湮沒，歲月遼遠。田生表菑川之譽，梁丘擅琅邪之學，代郡范生，山陽王氏，人藏荊山之寶，各盡玄言之趣，說或去取，意有詳略。近搢紳之學，咸有稽疑，隨答所問，已具別解。知與張譏等三百一十二人須釋乾坤文言及二繫，萬機小暇，試當討論。」
          - paragraph [ref=f7e156]: 弘正博物知玄象，善占候。大同末，嘗謂弟弘讓曰：「國家厄運，數年當有兵起，吾與汝不知何所逃之。」及梁武帝納侯景，弘正謂弘讓曰：「亂階此矣。」京城陷，弘直為衡陽內史，元帝在江陵，遺弘直書曰：「適有都信，賢兄博士平安。但京師搢紳，無不附逆，王克已為家臣，陸緬身充卒伍，唯有周生，確乎不拔。言及西軍，潺湲掩淚，恆思吾至，如望歲焉，松柏後凋，一人而已。」王僧辯之討侯景也，弘正與弘讓自拔迎軍，僧辯得之甚喜，即日啟元帝，元帝手書與弘正曰：「獯醜逆亂，寒暑亟離，海內相識，零落略盡。韓非之智，不免秦獄，劉歆之學，猶弊亡新，音塵不嗣，每以耿灼。常欲訪山東而尋子雲，問關西而求伯起，遇有今信，力附相聞，遲比來郵，慰其延佇。」仍遣使迎之，謂朝士曰：「晉氏平吳，喜獲二陸，今我破賊，亦得兩周，今古一時，足為連類。」及弘正至，禮數甚優，朝臣無與比者。授黃門侍郎，直侍中省。俄遷左民尚書，尋加散騎常侍。
          - paragraph [ref=f7e157]: 元帝嘗著金樓子，曰：「余於諸僧重招提琰法師，隱士重華陽陶貞白，士大夫重汝南周弘正，其於義理，清轉無窮，亦一時之名士也。」及侯景平，僧辯啟送祕書圖籍，敕弘正讎校。
          - paragraph [ref=f7e158]: 時朝議遷都，朝士家在荊州者，皆不欲遷，唯弘正與僕射王裒言於元帝曰：「若束脩以上諸士大夫微見古今者，知帝王所都本無定處，無所與疑。至如黔首萬姓，若未見輿駕入建鄴，謂是列國諸王，未名天子。今宜赴百姓之心，從四海之望。」時荊、陝人士咸云王、周皆是東人，志願東下，恐非良計。弘正面折之曰：「若東人勸東，謂為非計，君等西人欲西，豈成良策？」元帝乃大笑之，竟不還都。
          - paragraph [ref=f7e159]:
            - text: 及江陵陷，弘正遁圍而出，歸於京師，敬帝以為大司馬王僧辯長史，行揚州事。
            - link "太平元年" [ref=f7e161] [cursor=pointer]:
              - /url: /wiki/Category:%E9%9C%80%E8%A6%81%E6%8C%87%E5%AE%9A%E5%85%AC%E5%85%83%E7%9A%84%E7%B4%80%E5%B9%B4
            - text: ，授侍中，領國子祭酒，遷太常卿、都官尚書。高祖受禪，授太子詹事。
            - link "天嘉元年" [ref=f7e163] [cursor=pointer]:
              - /url: /wiki/Category:560%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: ，遷侍中、國子祭酒，往長安迎高宗。三年，自周還，詔授金紫光祿大夫，加金章紫綬，領慈訓太僕。廢帝嗣位，領都官尚書，總知五禮事。仍授太傅長史，加明威將軍。高宗即位，遷特進，重領國子祭酒，豫州大中正，加扶。
            - link "太建五年" [ref=f7e165] [cursor=pointer]:
              - /url: /wiki/Category:573%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: ，授尚書右僕射，祭酒、中正如故。尋敕侍東宮講
            - link "論語" [ref=f7e166] [cursor=pointer]:
              - /url: /wiki/%E8%AB%96%E8%AA%9E
            - text: 、
            - link "孝經" [ref=f7e167] [cursor=pointer]:
              - /url: /wiki/%E5%AD%9D%E7%B6%93
            - text: 。太子以弘正朝廷舊臣，德望素重，於是降情屈禮，橫經請益，有師資之敬焉。
          - paragraph [ref=f7e168]:
            - text: 弘正特善玄言，兼明釋典，雖碩學名僧，莫不請質疑滯。六年，卒于官，時年七十九。詔曰：「追遠褒德，抑有恆規。故尚書右僕射、領國子祭酒、豫州大中正弘正，識宇凝深，藝業通備，辭林義府，國老民宗，道映庠門，望高禮閣，卒然殂殞，朕用惻然。可贈侍中、中書監，喪事所須，量加資給。」便出臨哭。諡曰簡子。所著
            - link "周易" [ref=f7e169] [cursor=pointer]:
              - /url: /wiki/%E5%91%A8%E6%98%93
            - text: 講疏十六卷，
            - link "論語" [ref=f7e170] [cursor=pointer]:
              - /url: /wiki/%E8%AB%96%E8%AA%9E
            - text: 疏十一卷，
            - link "莊子" [ref=f7e171] [cursor=pointer]:
              - /url: /wiki/%E8%8E%8A%E5%AD%90
            - text: 疏八卷，
            - link "老子" [ref=f7e172] [cursor=pointer]:
              - /url: /wiki/%E8%80%81%E5%AD%90
            - text: 疏五卷，
            - link "孝經" [ref=f7e173] [cursor=pointer]:
              - /url: /wiki/%E5%AD%9D%E7%B6%93
            - text: 疏兩卷，集二十卷，行于世。子墳，官至吏部郎。
          - paragraph [ref=f7e174]: 弘正二弟：弘讓，弘直。弘讓性簡素，博學多通，天嘉初，以白衣領太常卿、光祿大夫，加金章紫綬。
          - generic [ref=f7e175]:
            - heading "弟 弘直" [level=3] [ref=f7e176]
            - generic [ref=f7e177]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B724&action=edit&section=2
          - paragraph [ref=f7e178]: 弘直字思方，幼而聰敏。解褐梁太學博士，稍遷西中郎湘東王外兵記室參軍，與東海鮑泉、南陽宗懍、平原劉緩、沛郡劉同掌書記。入為尚書儀曹郎。湘東王出鎮江、荊二州，累除錄事諮議參軍，帶柴桑、當陽二縣令。及梁元帝承制，授假節、英果將軍、世子長史。尋除智武將軍、衡陽內史。遷貞毅將軍、平南長史、長沙內史，行湘州府州事，湘濱縣侯，邑六百戶。歷邵陵、零陵太守、雲麾將軍、昌州刺史。王琳之舉兵也，弘直在湘州，琳敗，乃還朝。天嘉中，歷國子博士、廬陵王長史、尚書左丞、領羽林監、中散大夫、祕書監，掌國史。遷太常卿、光祿大夫，加金章紫綬。
          - paragraph [ref=f7e179]:
            - link "太建七年" [ref=f7e181] [cursor=pointer]:
              - /url: /wiki/Category:575%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: ，遇疾且卒，乃遺疏敕其家曰：「吾今年已來，筋力減耗，可謂衰矣，而好生之情，曾不自覺，唯務行樂，不知老之將至。今時制云及，將同朝露，七十餘年，頗經稱足，啟手告全，差無遺恨。氣絕已後，便買市中見材，材必須小形者，使易提挈。斂以時服，古人通制，但下見先人，必須備禮，可著單衣裙衫故履。既應侍養，宜備紛帨，或逢善友，又須香煙，棺內唯安白布手巾、麤香爐而已，其外一無所用。」卒于家，時年七十六。有集二十卷。子確。
          - paragraph [ref=f7e182]:
            - text: 確字士潛，美容儀，寬大有行檢，博涉經史，篤好玄言，世父弘正特所鍾愛。解褐梁太學博士、司徒祭酒、晉安王主簿。高祖受禪，除尚書殿中郎，累遷安成王限內記室。高宗即位，授東宮通事舍人，丁母憂，去職。及歐陽紇平，起為中書舍人，命於廣州慰勞，服闋，為太常卿。歷太子中庶子、尚書左丞、太子家令，以父憂去職。尋起為貞威將軍、吳令，確固辭不之官。
            - link "至德元年" [ref=f7e184] [cursor=pointer]:
              - /url: /wiki/Category:%E9%9C%80%E8%A6%81%E6%8C%87%E5%AE%9A%E5%85%AC%E5%85%83%E7%9A%84%E7%B4%80%E5%B9%B4
            - text: ，授太子左衛率、中書舍人，遷散騎常侍，加貞威將軍、信州南平王府長史，〔六〕行揚州事。為政平允，稱為良吏。遷都官尚書。禎明初，遘疾，卒于官，時年五十九。詔贈散騎常侍、太常卿，官給喪事。
          - generic [ref=f7e185]:
            - heading "袁憲" [level=2] [ref=f7e186]
            - generic [ref=f7e187]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B724&action=edit&section=3
          - paragraph [ref=f7e188]: 袁憲字德章，尚書左僕射樞之弟也。幼聰敏，好學，有雅量。梁武帝脩建庠序，別開五館，其一館在憲宅西，憲常招引諸生，與之談論，每有新議，出人意表，同輩咸嗟服焉。
          - paragraph [ref=f7e189]:
            - link "大同八年" [ref=f7e191] [cursor=pointer]:
              - /url: /wiki/Category:%E9%9C%80%E8%A6%81%E6%8C%87%E5%AE%9A%E5%85%AC%E5%85%83%E7%9A%84%E7%B4%80%E5%B9%B4
            - text: ，武帝撰孔子正言章句，詔下國學，宣制旨義。憲時年十四，被召為國子正言生，謁祭酒到溉，溉目而送之，愛其神彩。在學一歲，國子博士周弘正謂憲父君正曰：「賢子今茲欲策試不？」君正曰：「經義猶淺，未敢令試。」居數日，君正遣門下客岑文豪與憲候弘正，會弘正將登講坐，弟子畢集，乃延憲入室，授之麈尾，令憲樹義。時謝岐、何妥在坐，弘正謂曰：「二賢雖窮奧賾，得無憚此後生耶！」何、謝於是遞起義端，深極理致，憲與往復數番，酬對閑敏。弘正謂妥曰：「恣卿所問，勿以童稚相期。」時學眾滿堂，觀者重沓，而憲神色自若，辯論有餘。弘正請起數難，終不能屈，因告文豪曰：「卿還咨袁吳郡，此郎已堪見代為博士矣。」時生徒對策，多行賄賂，文豪請具束脩，君正曰：「我豈能用錢為兒買第耶？」學司銜之。及憲試，爭起劇難，憲隨問抗答，剖析如流。到溉顧憲曰：「袁君正其有後矣。」及君正將之吳郡，溉祖道於征虜亭，謂君正曰：「昨策生蕭敏孫、徐孝克，非不解義，至於風神器局，去賢子遠矣。」尋舉高第。以貴公子選尚南沙公主，即梁簡文之女也。
          - paragraph [ref=f7e192]:
            - text: 大同元年，釋褐祕書郎。
            - link "太清二年" [ref=f7e194] [cursor=pointer]:
              - /url: /wiki/Category:548%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: ，遷太子舍人。侯景寇逆，憲東之吳郡，尋丁父憂，哀毀過禮。敬帝承制，徵授尚書殿中郎。高祖作相，除司徒戶曹。
            - link "永定元年" [ref=f7e196] [cursor=pointer]:
              - /url: /wiki/Category:%E9%9C%80%E8%A6%81%E6%8C%87%E5%AE%9A%E5%85%AC%E5%85%83%E7%9A%84%E7%B4%80%E5%B9%B4
            - text: ，授中書侍郎，兼散騎常侍。與黃門侍郎王瑜使齊，數年不遣，天嘉初乃還。四年，詔復中書侍郎，直侍中省。
            - link "太建元年" [ref=f7e198] [cursor=pointer]:
              - /url: /wiki/Category:569%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: ，除給事黃門侍郎，仍知太常事。二年，轉尚書吏部侍郎，尋除散騎常侍，侍東宮。三年，遷御史中丞，領羽林監。時豫章王叔英不奉法度，逼取人馬，憲依事劾奏，叔英由是坐免黜，自是朝野皆嚴憚焉。
          - paragraph [ref=f7e199]: 憲詳練朝章，尤明聽斷，至有獄情未盡而有司具法者，即伺閑暇，常為上言之，其所申理者甚眾。嘗陪醼承香閣，賓退之後，高宗留憲與衛尉樊俊徙席山亭，談宴終日。高宗目憲而謂俊曰「袁家故為有人」，其見重如此。
          - paragraph [ref=f7e200]: 五年，入為侍中。六年，除吳郡太守，以父任固辭不拜，改授明威將軍、南康內史。九年，秩滿，除散騎常侍，兼吏部尚書，尋而為真。憲以久居清顯，累表自求解任。高宗曰：「諸人在職，屢有謗書。卿處事已多，可謂清白，別相甄錄，且勿致辭。」十三年，遷右僕射，參掌選事。先是憲長兄簡懿子為左僕射，至是憲為右僕射，臺省內目簡懿為大僕射，憲為小僕射，朝廷榮之。
          - paragraph [ref=f7e201]: 及高宗不豫，憲與吏部尚書毛喜俱受顧命。始興王叔陵之肆逆也，憲指麾部分，預有力焉。後主被瘡病篤，執憲手曰：「我兒尚幼，後事委卿。」憲曰：「群情喁喁，冀聖躬康復，後事之旨，未敢奉詔。」以功封建安縣伯，邑四百戶，領太子中庶子，餘並如故。尋除侍中、信威將軍、太子詹事。
          - paragraph [ref=f7e202]:
            - link "至德元年" [ref=f7e204] [cursor=pointer]:
              - /url: /wiki/Category:%E9%9C%80%E8%A6%81%E6%8C%87%E5%AE%9A%E5%85%AC%E5%85%83%E7%9A%84%E7%B4%80%E5%B9%B4
            - text: ，太子加元服，二年，行釋奠之禮，〔七〕憲於是表請解職，後主不許，給扶二人，進號雲麾將軍，置佐史。皇太子頗不率典訓，憲手表陳諫凡十條，皆援引古今，言辭切直，太子雖外示容納，而心無悛改。後主欲立寵姬張貴妃子始安王為嗣，嘗從容言之，吏部尚書蔡徵順旨稱賞，憲厲色折之曰：「皇太子國家儲嗣，億兆宅心。卿是何人，輕言廢立！」夏，竟廢太子為吳興王。後主知憲有規諫之事，歎曰「袁德章實骨鯁之臣」，即日詔為尚書僕射。
          - paragraph [ref=f7e205]: 禎明（元）〔三〕年，隋軍來伐，〔八〕隋將賀若弼進燒宮城北掖門，宮衛皆散走，朝士稍各引去，惟憲衛侍左右。後主謂憲曰：「我從來待卿不先餘人，今日見卿，可謂歲寒知松柏後凋也。」後主遑遽將避匿，憲正色曰：「北兵之入，必無所犯，大事如此，陛下安之。臣願陛下正衣冠，御前殿，依梁武見侯景故事。」後主不從，因下榻馳去，憲從後堂景陽殿入，後主投下井中，憲拜哭而出。
          - paragraph [ref=f7e206]: 京城陷，入于隋，隋授使持節、昌州諸軍事、開府儀同三司、昌州刺史。開皇十四年，詔授晉王府長史。十八年卒，時年七十。贈大將軍，安城郡公，諡曰簡。長子承家，仕隋至祕書丞、國子司業。
          - generic [ref=f7e207]:
            - heading "【評】" [level=2] [ref=f7e208]
            - generic [ref=f7e209]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B724&action=edit&section=4
          - paragraph [ref=f7e210]: 史臣曰：梁元帝稱士大夫中重汝南周弘正，信哉斯言也！觀其雅量標舉，尤善玄言，亦一代之國師矣。袁憲風格整峻，徇義履道。韓子稱為人臣委質，心無有二。憲弗渝終始，良可嘉焉。
          - generic [ref=f7e211]:
            - heading "校勘記" [level=3] [ref=f7e212]
            - generic [ref=f7e213]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B724&action=edit&section=5
          - paragraph [ref=f7e214]: 〔一〕 汝南安城人（也） 據北監本、汲本、殿本刪。
          - paragraph [ref=f7e215]: 〔二〕 俱為（叔）〔伯〕父侍中護軍捨所養 據南史改。按南史周捨傳有「弟子弘正」之語，是周捨乃周弘正之伯父也。
          - paragraph [ref=f7e216]: 〔三〕 出為鄴令 錢大昕廿二史考異云：「梁之鄴縣未審所在。」又引袁廷檮曰：「『鄴』疑是『鄞』字。」
          - paragraph [ref=f7e217]: 〔四〕 〔中〕大通（二）〔三〕年梁昭明太子薨 按梁昭明太子卒於中大通三年，今補「中」字，「二」改「三」。南史亦脫「中」字，「三」字不訛。
          - paragraph [ref=f7e218]: 〔五〕 復興於（遂）〔邃〕古 據北監本、汲本、殿本改。
          - paragraph [ref=f7e219]: 〔六〕 信州南平王府長史 南平王時為揚州刺史，確以長史行揚州事，何來一「信州」？按南平王嶷傳，嶷於至德元年除信武將軍，「 信州」疑為「信武」之訛。
          - paragraph [ref=f7e220]: 〔七〕 至德元年至行釋奠之禮 按後主紀，太子加元服在至德二年七月，行釋奠禮在三年十二月。
          - paragraph [ref=f7e221]: 〔八〕 禎明（元）〔三〕年隋軍來伐 按賀若弼渡江至建業，為禎明三年，「元」為「三」字之訛，今改。
