                - text: ↑
              - generic [ref=f4e245]:
                - text: 徵為中撫大將軍 「中撫大將軍」〈世祖紀〉作「中撫軍大將軍」，《
                - link "南史" [ref=f4e246] [cursor=pointer]:
                  - /url: /wiki/%E5%8D%97%E5%8F%B2
                - text: 》亦作「中撫軍大將軍」。按「中撫」各書或作「中撫軍」。
            - listitem [ref=f4e247]:
