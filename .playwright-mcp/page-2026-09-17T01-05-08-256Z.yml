                  - paragraph [ref=f4e149]: 黃法抃 淳于量 章昭達
          - generic [ref=f4e150]:
            - heading "黃法抃" [level=2] [ref=f4e151]
            - generic [ref=f4e152]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B711&action=edit&section=1
          - paragraph [ref=f4e153]: 黃法抃字仲昭，巴山新建人也。少勁捷有膽力，步行日三百里，距躍三丈。頗便書疏，閑明簿領，出入郡中，為鄉閭所憚。侯景之亂，於鄉里合徒眾。太守賀詡下江州，法抃監知郡事。高祖將踰嶺入援建業，李遷仕作梗中途，高祖命周文育屯于西昌，法抃遣兵助文育。時法抃出頓新淦縣，景遣行臺于慶至豫章，慶分兵來襲新淦，法抃拒戰，敗之。高祖亦遣文育進軍討慶，文育疑慶兵彊，未敢進，法抃率眾會之，因進克笙屯，俘獲甚眾。
          - paragraph [ref=f4e154]:
            - text: 梁元帝承制授超猛將軍、交州刺史資，領新淦縣令，封巴山縣子，邑三百戶。
            - link "承聖三年" [ref=f4e156] [cursor=pointer]:
              - /url: /wiki/Category:554%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: ，除明威將軍、游騎將軍，進爵為侯，邑五百戶。貞陽侯僭位，除左驍騎將軍。敬帝即位，改封新建縣侯，邑如前。
          - paragraph [ref=f4e157]:
            - link "太平元年" [ref=f4e159] [cursor=pointer]:
              - /url: /wiki/Category:%E9%9C%80%E8%A6%81%E6%8C%87%E5%AE%9A%E5%85%AC%E5%85%83%E7%9A%84%E7%B4%80%E5%B9%B4
            - text: ，割江州四郡置高州，以法抃為使持節、散騎常侍、都督高州諸軍事、信武將軍、高州刺史，鎮于巴山。蕭勃遣歐陽頠攻法抃，法抃與戰，破之。
          - paragraph [ref=f4e160]:
            - link "永定二年" [ref=f4e162] [cursor=pointer]:
              - /url: /wiki/Category:558%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: ，王琳遣李孝欽、樊猛、余孝頃攻周迪，且謀取法抃，法抃率兵援迪，擒孝頃等三將。進號宣毅將軍，增邑并前一千戶，給鼓吹一部。又以拒王琳功，授平南將軍、開府儀同三司。熊曇朗於金口反，害周文育，法抃共周迪討平之，語在曇朗傳。
          - paragraph [ref=f4e163]:
            - text: 世祖嗣位，進號安南將軍。
            - link "天嘉二年" [ref=f4e165] [cursor=pointer]:
              - /url: /wiki/Category:561%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: ，周迪反，法抃率兵會都督吳明徹，討迪於工塘。迪平，法抃功居多。徵為使持節、散騎常侍、都督南徐州諸軍事、鎮北大將軍、南徐州刺史，儀同、鼓吹並如故。未拜，尋又改授都督江吳二州諸軍事、鎮南大將軍、江州刺史。六年，徵為中衛大將軍。
          - paragraph [ref=f4e166]:
            - text: 廢帝即位，進爵為公，給扶。
            - link "光大元年" [ref=f4e168] [cursor=pointer]:
              - /url: /wiki/Category:567%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: ，出為使持節、都督南徐州諸軍事、鎮北將軍、南徐州刺史。二年，徙為都督郢巴武三州諸軍事、鎮西將軍、郢州刺史，持節如故。
          - paragraph [ref=f4e169]:
            - link "太建元年" [ref=f4e171] [cursor=pointer]:
              - /url: /wiki/Category:569%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: ，進號征西大將軍。二年，徵為侍中、中權大將軍。四年，出為使持節、散騎常侍、都督南豫州諸軍事、征南大將軍、南豫州刺史。五年，大舉北伐，都督吳明徹出秦郡，以法抃為都督，出歷陽。齊遣其歷陽王步騎五萬來援，
            - superscript [ref=f4e172]:
              - link "[1]" [ref=f4e173] [cursor=pointer]:
                - /url: "#cite_note-1"
            - text: 於小峴築城，法抃遣左衛將軍樊毅分兵於大峴禦之，大破齊軍，盡獲人馬器械。於是乃為拍車及步艦，豎拍以逼歷陽。歷陽人窘蹴乞降，法抃緩之，則又堅守，法抃怒，親率士卒攻城，施拍加其樓堞。時又大雨，城崩，克之，盡誅戍卒。進兵合肥，望旗降款，法抃不令軍士侵掠，躬自撫勞，而與之盟，並放還北。以功加侍中，改封義陽郡公，邑二千戶。其年，遷都督合霍二州諸軍事、征西大將軍、合州刺史，增邑五百戶。七年，徙都督豫建光朔合北徐六州諸軍事、豫州刺史，鎮壽陽，侍中、散騎常侍、持節、將軍、儀同、鼓吹、扶並如故。八年十月，薨，時年五十九。贈侍中、中權大將軍、司空，諡曰威。子玩嗣。
          - generic [ref=f4e174]:
            - heading "淳于量" [level=2] [ref=f4e175]
            - generic [ref=f4e176]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B711&action=edit&section=2
          - paragraph [ref=f4e177]: 淳于量字思明。其先濟北人也，世居京師。父文成，仕梁為將帥，官至光烈將軍、梁州刺史。
          - paragraph [ref=f4e178]: 量少善自居處，偉姿容，有幹略，便弓馬。梁元帝為荊州刺史，文成分量人馬，令往事焉。起家湘東王國常侍，兼西中郎府中兵參軍。累遷府佐、常兼中兵、直兵者十餘載，兵甲士卒，盛於府中。
          - paragraph [ref=f4e179]: 荊、雍之界，蠻左數反，山帥文道期積為邊患，中兵王僧辯征之，頻戰不利，遣量助之。量至，與僧辯并力，大破道期，斬其酋長，俘虜萬計。以功封廣晉縣男，邑三百戶，授涪陵太守。歷為新興、武寧二郡太守。
          - paragraph [ref=f4e180]:
            - text: 侯景之亂，梁元帝凡遣五軍入援京邑，量預其一。臺城陷，量還荊州。元帝承制以量為假節、通直散騎常侍、都督巴州諸軍事、信威將軍、巴州刺史。侯景西上攻巴州，元帝使都督王僧辯入據巴陵。量與僧辯并力拒景，大敗景軍，擒其將任約。進攻郢州，獲宋子仙。仍隨僧辯克平侯景。
            - link "承聖元年" [ref=f4e182] [cursor=pointer]:
              - /url: /wiki/Category:552%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: ，以功授左衛將軍，封謝沐縣侯，邑五百戶。尋出為持節、都督桂定東西寧等四州諸軍事、信威將軍、安遠護軍、桂州刺史。
          - paragraph [ref=f4e183]: 荊州陷，量保據桂州。王琳擁割湘、郢，累遣召量，量外雖與琳往來，而別遣使從閒道歸於高祖。高祖受襌，授持節、散騎常侍、平西大將軍，給鼓吹一部，都督、刺史並如故。尋進號鎮南將軍。仍授都督、鎮西大將軍、開府儀同三司。世祖嗣位，進號征南大將軍。
          - paragraph [ref=f4e184]:
            - text: 王琳平後，頻請入朝，
            - link "天嘉五年" [ref=f4e186] [cursor=pointer]:
              - /url: /wiki/Category:564%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: ，徵為中撫大將軍，
            - superscript [ref=f4e187]:
              - link "[2]" [ref=f4e188] [cursor=pointer]:
                - /url: "#cite_note-2"
            - text: 常侍、儀同、鼓吹並如故。量所部將帥，多戀本土，
            - superscript [ref=f4e189]:
              - link "[3]" [ref=f4e190] [cursor=pointer]:
                - /url: "#cite_note-3"
            - text: 並欲逃入山谷，不願入朝。世祖使湘州刺史華皎征衡州界黃洞，且以兵迎量。
            - link "天康元年" [ref=f4e192] [cursor=pointer]:
              - /url: /wiki/Category:%E9%9C%80%E8%A6%81%E6%8C%87%E5%AE%9A%E5%85%AC%E5%85%83%E7%9A%84%E7%B4%80%E5%B9%B4
            - text: ，至都，以在道淹留，為有司所奏，免儀同，餘並如故。
            - link "光大元年" [ref=f4e194] [cursor=pointer]:
              - /url: /wiki/Category:567%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: ，給鼓吹一部。華皎構逆，以量為使持節、征南大將軍、西討大都督，總率大艦，自郢州樊浦拒之。皎平，并降周將長胡公拓跋定等。以功授侍中、中軍大將軍、開府儀同三司，進封醴陵縣公，增邑一千戶。未拜，出為使持節、都督南徐州諸軍事、鎮北將軍、南徐州刺史，侍中、儀同、鼓吹並如故。
          - paragraph [ref=f4e195]:
            - link "太建元年" [ref=f4e197] [cursor=pointer]:
              - /url: /wiki/Category:569%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: ，進號征北大將軍，給扶。三年，坐就江陰王蕭季卿買梁陵中樹，季卿坐免，量免侍中。尋復加侍中。五年，徵為中護大將軍，
            - superscript [ref=f4e198]:
              - link "[4]" [ref=f4e199] [cursor=pointer]:
                - /url: "#cite_note-4"
            - text: 侍中、儀同、鼓吹、扶並如故。
          - paragraph [ref=f4e200]: 吳明徹之西伐也，量贊成其事，遣第六子岑率所領從軍。淮南克定，量改封始安郡公，增邑一千五百戶。六年，出為使持節、都督郢巴南司定四州諸軍事、征西大將軍、郢州刺史，侍中、儀同、鼓吹、扶並如故。七年，徵為中軍大將軍、護軍將軍。九年，以公事免侍中。尋復加侍中。十年，吳明徹陷沒，加量使持節、都督水陸諸軍事，仍授散騎常侍、都督南北兗譙三州諸軍事、車騎將軍、南兗州刺史，餘並如故。十三年，加左光祿大夫，增邑五百戶，餘並如故。十四年四月薨，時年七十二。贈司空。
          - generic [ref=f4e201]:
            - heading "章昭達" [level=2] [ref=f4e202]
            - generic [ref=f4e203]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B711&action=edit&section=3
          - paragraph [ref=f4e204]: 章昭達字伯通，吳興武康人也。祖道蓋，齊廣平太守。父法尚，梁揚州議曹從事。
          - paragraph [ref=f4e205]: 昭達性倜儻，輕財尚氣。少時，嘗遇相者，謂昭達曰：「卿容貌甚善，須小虧損，則當富貴。」梁大同中，昭達為東宮直後，因醉墜馬，鬢角小傷，昭達喜之，相者曰「未也」。及侯景之亂，昭達率募鄉人援臺城，為流矢所中，眇其一目，相者見之，曰：「卿相善矣，不久當貴。」
          - paragraph [ref=f4e206]: 京城陷，昭達還鄉里，與世祖遊，因結君臣之分。侯景平，世祖為吳興太守，昭達杖策來謁世祖。世祖見之大喜，因委以將帥，恩寵優渥，超於儕等。及高祖討王僧辯，令世祖還長城招聚兵眾，以備杜龕，頻使昭達往京口，稟承計畫。僧辯誅後，龕遣其將杜泰來攻長城，世祖拒之，命昭達總知城內兵事。及杜泰退走，因從世祖東進，軍吳興，以討杜龕。龕平，又從世祖東討張彪於會稽，克之。累功除明威將軍、定州刺史。
          - paragraph [ref=f4e207]:
            - text: 是時留異擁據東陽，私署守宰，高祖患之，乃使昭達為長山縣令，居其心腹。
            - link "永定二年" [ref=f4e209] [cursor=pointer]:
              - /url: /wiki/Category:558%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: ，除武康令。世祖嗣位，除員外散騎常侍。
            - link "天嘉元年" [ref=f4e211] [cursor=pointer]:
              - /url: /wiki/Category:560%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: ，追論長城之功，封欣樂縣侯，邑一千戶。
          - paragraph [ref=f4e212]:
            - text: 尋隨侯安都等拒王琳于（沌）[柵]口，
            - superscript [ref=f4e213]:
              - link "[5]" [ref=f4e214] [cursor=pointer]:
                - /url: "#cite_note-5"
            - text: 戰于蕪湖，昭達乘平虜大艦，中流而進，先鋒發拍中于賊艦。王琳平，昭達冊勳第一。二年，除使持節、散騎常侍、都督郢巴武沅四州諸軍事、智武將軍、郢州刺史，增邑并前千五百戶。尋進號平西將軍。
          - paragraph [ref=f4e215]: 周迪據臨川反，詔令昭達便道征之。及迪敗走，徵為護軍將軍，給鼓吹一部，改封邵武縣侯，增邑并前二千戶，常侍如故。四年，陳寶應納周迪，復共寇臨川，又以昭達為都督討迪。至東興嶺，而迪又退走。昭達仍踰嶺，頓于建安，以討陳寶應。寶應據建安、晉安二郡之界，水陸為柵，以拒官軍。昭達與戰不利，因據其上流，命軍士伐木帶枝葉為筏，施拍於其上，綴以大索，相次列營，夾于兩岸。寶應數挑戰，昭達按甲不動。俄而暴雨，江水大長，昭達放筏衝突寶應水柵，水柵盡破。又出兵攻其步軍。方大合戰，會世祖遣余孝頃出自海道。適至，因并力乘之，寶應大潰，遂克定閩中，盡擒留異、寶應等。以功授鎮前將軍、開府儀同三司。
          - paragraph [ref=f4e216]: 初，世祖嘗夢昭達升於台鉉，及旦，以夢告之。至是侍醼，世祖顧昭達曰：「卿憶夢不？何以償夢？」昭達對曰：「當效犬馬之用，以盡臣節，自餘無以奉償。」尋又出為使持節、都督江郢吳三州諸軍事、鎮南將軍、江州刺史，常侍、儀同、鼓吹如故。
          - paragraph [ref=f4e217]: 廢帝即位，遷侍中、征南將軍，改封邵陵郡公。華皎之反也，其移書文檄，並假以昭達為辭，又頻遣使招之，昭達盡執其使，送于京師。皎平，進號征南大將軍，增邑并前二千五百戶。秩滿，徵為中撫大將軍，侍中、儀同、鼓吹如故。高宗即位，進號車騎大將軍，以還朝遲留，為有司所劾，降號車騎將軍。
          - paragraph [ref=f4e218]: 歐陽紇據有嶺南反，詔昭達都督眾軍討之。昭達倍道兼行，達于始興。紇聞昭達奄至，恇擾不知所為，乃出頓洭口，多聚沙石，盛以竹籠，置于水柵之外，用遏舟艦。昭達居其上流，裝艫造拍，以臨賊柵。又令軍人銜刀，潛行水中，以斫竹籠，籠篾皆解。因縱大艦隨流突之，賊眾大敗，因而擒紇，送于京師，廣州平。以功進車騎大將軍，遷司空，餘並如故。
          - paragraph [ref=f4e219]:
            - link "太建二年" [ref=f4e221] [cursor=pointer]:
              - /url: /wiki/Category:570%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
            - text: ，率師征蕭巋于江陵。時蕭巋與周軍大蓄舟艦於青泥中，昭達分遣偏將錢道戢、程文季等，乘輕舟襲之，焚其舟艦。周兵又於峽下南岸築壘，
            - superscript [ref=f4e222]:
              - link "[6]" [ref=f4e223] [cursor=pointer]:
                - /url: "#cite_note-6"
            - text: 名曰安蜀城，於江上橫引大索，編𥯤為橋，
            - superscript [ref=f4e224]:
              - link "[7]" [ref=f4e225] [cursor=pointer]:
                - /url: "#cite_note-7"
            - text: 以度軍糧。昭達乃命軍士為長戟，施於樓船之上，仰割其索，索斷糧絕，因縱兵以攻其城，降之。
          - paragraph [ref=f4e226]: 三年，遘疾，薨，時年五十四。贈大將軍，增邑五百戶，給班劍二十人。
          - paragraph [ref=f4e227]: 昭達性嚴刻，每奉命出征，必晝夜倍道；然有所克捷，必推功將帥，廚膳飲食，並同於群下，將士亦以此附之。每飲會，必盛設女伎雜樂，備盡羌胡之聲，音律姿容，並一時之妙，雖臨對寇敵，旗鼓相望，弗之廢也。四年，配享世祖廟庭。
          - paragraph [ref=f4e228]:
            - text: 子大寶，襲封邵陵郡公，累官至散騎常侍、護軍。出為豐州刺史，在州貪縱，百姓怨酷，後主以太僕卿李暈代之。
            - link "至德三年" [ref=f4e230] [cursor=pointer]:
              - /url: /wiki/Category:%E9%9C%80%E8%A6%81%E6%8C%87%E5%AE%9A%E5%85%AC%E5%85%83%E7%9A%84%E7%B4%80%E5%B9%B4
            - text: 四月，暈將到州，大寶乃襲殺暈，舉兵反，遣其將楊通寇建安。建安內史吳慧覺據郡城拒之，通累攻不克。官軍稍近，人情離異，大寶計窮，乃與通俱逃。臺軍主陳景詳率兵追躡大寶。大寶既入山，山路阻險，不復能行，通背負之，稍進。尋為追兵所及，生擒送都，於路死，傳首梟于朱雀航，夷三族。
          - generic [ref=f4e231]:
            - heading "【論】" [level=2] [ref=f4e232]
            - generic [ref=f4e233]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B711&action=edit&section=4
          - paragraph [ref=f4e234]: 史臣曰：黃法抃、淳于量值梁末喪亂，劉、項未分，其有辯明暗見是非者蓋鮮，二公達向背之理，位至鼎司，亦其智也。昭達與世祖鄉壤惟舊，義等鄧、蕭，世祖纂曆，委任隆重，至於戰勝攻取，累平寇難，斯亦良臣良將，一代之吳、耿矣。
          - generic [ref=f4e235]:
            - heading "校勘記" [level=3] [ref=f4e236]
            - generic [ref=f4e237]:
              - link "编辑":
                - /url: /w/index.php?title=%E9%99%B3%E6%9B%B8/%E5%8D%B711&action=edit&section=5
          - list [ref=f4e238]:
            - listitem [ref=f4e239]:
              - link "跳转" [ref=f4e241] [cursor=pointer]:
                - /url: "#cite_ref-1"
                - text: ↑
              - text: 齊遣其歷陽王步騎五萬來援 按〈宣帝紀〉云「齊遣兵十萬援歷陽」，此云「五萬」，與紀異。
            - listitem [ref=f4e242]:
              - link "跳转" [ref=f4e244] [cursor=pointer]:
