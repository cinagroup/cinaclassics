              - generic [ref=f4e253]:
                - text: 徵為中護大將軍 「中護大將軍」〈宣帝紀〉
                - link "太建五年" [ref=f4e255] [cursor=pointer]:
                  - /url: /wiki/Category:573%E5%B9%B4_(%E6%8F%90%E5%8F%8A)
                - text: 、六年並作「中權大將軍」，徐陵傳作「中權將軍」。
            - listitem [ref=f4e256]:
              - link "跳转" [ref=f4e258] [cursor=pointer]:
                - /url: "#cite_ref-5"
                - text: ↑
              - generic [ref=f4e259]:
                - text: 尋隨侯安都等拒王琳于（沌）[柵]口 據〈侯安都傳〉、〈侯瑱傳〉及《通鑑》改。按《
                - link "通鑑" [ref=f4e260] [cursor=pointer]:
                  - /url: /wiki/%E8%B3%87%E6%B2%BB%E9%80%9A%E9%91%91
                - text: 》胡注云「柵口在濡須口之東，水導巢湖，今謂之柵江口」。若沌口，則為前王琳大敗陳師，侯安都等被俘處，當沌水入江之口，遠在柵口之西矣。
            - listitem [ref=f4e261]:
              - link "跳转" [ref=f4e263] [cursor=pointer]:
                - /url: "#cite_ref-6"
                - text: ↑
              - generic [ref=f4e264]:
                - text: 周兵又於峽下南岸築壘 「峽下」《
                - link "南史" [ref=f4e265] [cursor=pointer]:
                  - /url: /wiki/%E5%8D%97%E5%8F%B2
                - text: 》作「峽口」，《通鑑》同。按《通鑑》胡注云：「峽口，西陵峽口也。」
            - listitem [ref=f4e266]:
              - link "跳转" [ref=f4e268] [cursor=pointer]:
                - /url: "#cite_ref-7"
                - text: ↑
              - text: 編𥯤為橋 「𥯤」北監本、汲本、殿本並作「葦」，《南史》、《通鑑》同。
